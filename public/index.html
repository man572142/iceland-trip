<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a0f">
<title>冰島 16 天行程 · 互動地圖</title>
<style>
  :root{
    /* ---------- Basalt: cool volcanic neutrals ---------- */
    --ink-950:#070a0f;
    --ink-900:#0c121a;
    --ink-850:#111925;
    --ink-800:#16202e;
    --ink-750:#1c2838;
    --ink-700:#243247;
    --ink-600:#33455f;
    --ink-400:#7e93ac;
    --ink-300:#9aadc4;
    --ink-200:#c2d1e2;
    --ink-100:#e4ecf6;

    /* ---------- Semantic surfaces & text ---------- */
    --bg:var(--ink-950);
    --sunken:var(--ink-900);
    --surface:var(--ink-850);
    --surface-2:var(--ink-800);
    --surface-3:var(--ink-750);
    --line:var(--ink-700);
    --line-2:var(--ink-600);
    --text:var(--ink-100);
    --text-2:var(--ink-200);
    --text-3:var(--ink-300);
    --text-4:var(--ink-400);

    /* ---------- Iceland accents ---------- */
    --aurora:#45d9bd;                      /* 景點 */
    --aurora-hi:#8bf0dc;
    --aurora-08:rgba(69,217,189,.08);
    --aurora-14:rgba(69,217,189,.14);
    --aurora-28:rgba(69,217,189,.28);
    --aurora-45:rgba(69,217,189,.45);
    --glacier:#8ab4ff;                     /* 城鎮 / 交通 */
    --glacier-14:rgba(138,180,255,.14);
    --sulphur:#f2b544;
    --ember:#ff9166;
    --on-aurora:#04140f;

    /* ---------- Scale ---------- */
    /* ---------- Type scale ---------- */
    --t-xs:11px;    /* meta, chips, credits, flight numbers */
    --t-sm:13px;    /* secondary text, controls, dense tables */
    --t-md:15px;    /* body, list titles, lede */
    --t-lg:19px;    /* price, mobile headline */
    --t-xl:24px;    /* selected-spot headline */

    --r-sm:8px; --r-md:11px; --r-lg:16px;
    --shadow-1:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.7);
    --shadow-2:0 2px 6px rgba(0,0,0,.35), 0 14px 32px -16px rgba(0,0,0,.75);
    --shadow-sheet:0 -2px 8px rgba(0,0,0,.3), 0 -22px 48px -22px rgba(0,0,0,.85);

    --ease:cubic-bezier(.16,1,.3,1);
    --dur:.34s;
  }

  *{box-sizing:border-box}
  html{
    height:100%;
    color-scheme:dark;
    caret-color:var(--aurora);
    scrollbar-color:var(--line-2) transparent;
  }
  body{
    height:100%;
    margin:0;
    background:
      radial-gradient(1100px 520px at 82% -12%, rgba(138,180,255,.13), transparent 62%),
      radial-gradient(880px 460px at -6% -4%, rgba(69,217,189,.11), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:var(--t-md);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--aurora-28);color:#fff}
  :focus-visible{outline:2px solid var(--aurora-hi);outline-offset:2px}

  /* ---------- Icons: one 24px grid, one stroke weight ---------- */
  .ico{
    width:var(--ico,15px);height:var(--ico,15px);flex:none;display:block;
    fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;
    overflow:visible;
  }
  .sprite{position:absolute;width:0;height:0;overflow:hidden}

  /* ---------- Scrollbars ---------- */
  .scroller{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
  .scroller::-webkit-scrollbar{width:10px;height:10px}
  .scroller::-webkit-scrollbar-track{background:transparent}
  .scroller::-webkit-scrollbar-thumb{
    background:var(--line-2);border-radius:99px;
    border:3px solid transparent;background-clip:content-box;
  }
  .scroller::-webkit-scrollbar-thumb:hover{background:#405672;background-clip:content-box}

  /* ---------- Header ---------- */
  .itin-head{padding:2px 4px 14px}
  .itin-head h1{
    font-size:var(--t-lg);margin:0;font-weight:700;letter-spacing:.01em;line-height:1.35;
  }
  .itin-head .region{
    margin:3px 0 0;font-size:var(--t-sm);color:var(--text-3);line-height:1.6;
  }
  .itin-head .order{margin:2px 0 0;font-size:var(--t-xs);color:var(--text-4);letter-spacing:.04em;line-height:1.6}
  .legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:var(--t-sm);color:var(--text-4)}
  .legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .legend i{width:8px;height:8px;border-radius:50%}

  /* ---------- Layout ---------- */
  .wrap{
    display:grid;
    grid-template-columns:minmax(360px,440px) 1fr;
    height:100vh;
    height:100dvh;
  }

  /* ---------- Left: itinerary ---------- */
  .itinerary{
    overflow-y:auto;
    border-right:1px solid var(--line);
    padding:16px 14px 64px;
  }

  .intro{
    display:flex;flex-wrap:wrap;gap:6px 11px;align-items:flex-start;text-decoration:none;
    transition:border-color .16s,background .16s;
    background:linear-gradient(158deg,var(--aurora-08),rgba(138,180,255,.05));
    border:1px solid var(--line);
    border-radius:var(--r-md);
    padding:13px 15px;
    margin-bottom:14px;
    font-size:var(--t-sm);line-height:1.8;color:var(--text-2);
  }
  .intro .ico{--ico:17px;color:var(--aurora);margin-top:2px;flex:none}
  .intro>span:not(.intro-go){flex:1 1 260px;min-width:0}
  .intro:hover{border-color:var(--aurora-45)}
  .intro-go{
    display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:auto;
    align-self:center;white-space:nowrap;font-weight:600;color:var(--aurora-hi);
  }
  .intro b{color:var(--aurora-hi);font-weight:600;font-variant-numeric:tabular-nums}

  .list-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 4px 9px;
  }
  .list-bar .count{font-size:var(--t-xs);color:var(--text-4);letter-spacing:.04em}
  .ghost-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:var(--t-sm);font-weight:500;
    color:var(--text-3);background:transparent;
    border:1px solid var(--line);border-radius:var(--r-sm);
    padding:5px 10px;cursor:pointer;
    transition:color .16s,border-color .16s,background .16s;
  }
  .ghost-btn:hover{color:var(--text);border-color:var(--line-2);background:var(--surface-2)}
  .ghost-btn .ico{--ico:14px;transition:transform var(--dur) var(--ease)}
  .ghost-btn.all-open .ico{transform:rotate(180deg)}

  .search-bar{position:relative;margin:0 4px 9px}
  .search-bar .ico{
    --ico:15px;position:absolute;left:10px;top:50%;transform:translateY(-50%);
    color:var(--text-4);pointer-events:none;
  }
  .search-bar input{
    width:100%;font-family:inherit;font-size:var(--t-sm);color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:8px 32px;transition:border-color .16s,background .16s;
    appearance:none;-webkit-appearance:none;
  }
  .search-bar input::-webkit-search-cancel-button{display:none}
  .search-bar input::placeholder{color:var(--text-4)}
  .search-bar input:focus{outline:none;border-color:var(--aurora-45);background:var(--surface)}
  .search-bar .clear-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;padding:0;border:0;border-radius:99px;
    color:var(--text-4);background:transparent;cursor:pointer;
  }
  .search-bar .clear-btn:hover{color:var(--text);background:var(--surface-3)}
  .search-bar .clear-btn .ico{position:static;transform:none;--ico:13px}
  .search-bar .clear-btn[hidden]{display:none}

  .day-list{list-style:none;margin:0;padding:0}

  .day{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-md);
    margin-bottom:9px;
    transition:border-color .2s,background .2s;
  }
  .day:hover{border-color:var(--line-2)}
  .day.open{background:var(--surface-2);border-color:var(--line-2)}

  .day-head{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;column-gap:12px;
    width:100%;
    padding:11px 13px;
    cursor:pointer;user-select:none;text-align:left;
    background:transparent;border:0;border-radius:var(--r-md);
    color:inherit;font-family:inherit;
    transition:background .16s;
  }
  .day-head:hover{background:var(--aurora-08)}
  .day-head:focus-visible{outline:2px solid var(--aurora-hi);outline-offset:-2px}
  .day-no{
    min-width:52px;text-align:center;
    font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;
    font-variant-numeric:tabular-nums;
    color:var(--day-c,var(--text-3));background:var(--surface-3);
    border:1px solid var(--day-c,var(--line-2));
    padding:5px 7px;border-radius:var(--r-sm);
    transition:color .2s,background .2s,border-color .2s;
  }
  .day.open .day-no{color:var(--on-aurora);background:var(--day-c,var(--aurora));border-color:var(--day-c,var(--aurora))}
  .day-main{min-width:0}
  .day-title{
    display:block;font-size:var(--t-md);font-weight:600;line-height:1.35;color:var(--text);
  }
  .day-meta{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    margin-top:3px;font-size:var(--t-xs);color:var(--text-4);
    font-variant-numeric:tabular-nums;
  }
  .chev{--ico:16px;color:var(--text-4);transition:transform var(--dur) var(--ease),color .2s}
  .day.open .chev{transform:rotate(90deg);color:var(--aurora)}

  /* Accordion: animates from 0fr to 1fr */
  .day-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur) var(--ease)}
  .day.open .day-body{grid-template-rows:1fr}
  .day-body-inner{overflow:hidden;min-height:0}
  .day-body-pad{padding:0 12px 12px}

  .day-note{
    font-size:var(--t-sm);color:var(--text-3);line-height:1.85;
    margin:0 0 10px;padding:0 2px;
  }

  /* Spot list: a rail connects the day's stops in driving order */
  .day-spots{list-style:none;margin:0;padding:0;position:relative}
  .day-spots::before{
    content:"";position:absolute;left:16px;top:22px;bottom:22px;width:1px;
    background:linear-gradient(var(--line-2),var(--line));
  }
  .day-spots li{margin:0;padding:0}

  .spot{
    display:flex;align-items:flex-start;gap:11px;
    width:100%;text-align:left;
    background:transparent;border:1px solid transparent;
    color:var(--text);
    padding:8px 10px;margin:1px 0;
    border-radius:var(--r-sm);cursor:pointer;
    font-family:inherit;font-size:var(--t-md);
    transition:background .16s,border-color .16s;
  }
  .spot:focus-visible{outline:2px solid var(--aurora-hi);outline-offset:-2px}
  .spot:hover{background:var(--surface-3);border-color:var(--line)}
  .spot.active{background:var(--aurora-14);border-color:var(--aurora-45)}

  .dot{
    position:relative;z-index:1;
    flex:0 0 auto;width:10px;height:10px;border-radius:50%;
    background:var(--aurora);margin-top:6px;
    outline:3px solid var(--aurora-14);
    transition:outline-color .16s;
  }
  .spot.city .dot{background:var(--glacier);outline-color:var(--glacier-14)}
  .spot.active .dot{outline-color:var(--aurora-28)}
  /* the rail must not show through the marker */
  .spot .dot{box-shadow:0 0 0 3px var(--surface)}
  .day.open .spot .dot{box-shadow:0 0 0 3px var(--surface-2)}

  .spot-txt{flex:1;min-width:0}
  .spot-name{font-weight:600;line-height:1.45;color:var(--text)}
  .spot-zh{display:block;font-size:var(--t-xs);color:var(--text-4);margin-top:1px}

  .badge{
    display:inline-flex;align-items:center;
    font-size:var(--t-xs);font-weight:600;line-height:1.6;
    padding:1px 7px;border-radius:99px;margin-left:7px;
    vertical-align:1px;white-space:nowrap;
    background:rgba(126,147,172,.16);color:var(--text-3);
    border:1px solid rgba(126,147,172,.24);
  }
  .badge.fixed{
    background:var(--aurora-14);color:var(--aurora);
    border-color:var(--aurora-28);
  }
  .badge.seq{
    background:var(--glacier-14);color:var(--glacier);
    border-color:rgba(138,180,255,.26);font-variant-numeric:tabular-nums;
  }

  /* Decision meta — rendered only where the spot carries the data */
  .s-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px}
  .chip{
    font-size:var(--t-xs);line-height:1.75;white-space:nowrap;
    padding:0 7px;border-radius:99px;
    color:var(--text-3);background:var(--surface-3);
    border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  .day.open .chip{background:var(--surface)}
  .chip.type{color:var(--text-2)}
  .chip.book{
    color:var(--sulphur);background:rgba(242,181,68,.09);
    border-color:rgba(242,181,68,.28);
  }
  .chip.fixed{
    color:var(--aurora);background:var(--aurora-08);
    border-color:var(--aurora-28);font-weight:600;
  }

  /* Day load: net driving + summed dwell, on one 12 h ruler shared by every day */
  .budget{
    display:flex;align-items:center;flex-wrap:wrap;gap:5px 11px;
    margin:0 2px 11px;padding:8px 11px;
    background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);
    font-size:var(--t-xs);color:var(--text-4);font-variant-numeric:tabular-nums;
  }
  .budget b{color:var(--text-2);font-weight:600}
  .budget b.tot{color:var(--aurora-hi)}
  .budget .key{display:inline-flex;align-items:center;gap:5px}
  .budget .key::before{content:"";width:7px;height:7px;border-radius:2px;flex:none}
  .budget .k-drive::before{background:var(--glacier)}
  .budget .k-dwell::before{background:var(--aurora)}
  .bar{
    flex:1 1 100%;display:flex;height:5px;margin-top:2px;
    border-radius:99px;background:var(--surface-3);overflow:hidden;
  }
  .bar i{display:block;height:100%}
  .bar .b-drive{background:var(--glacier);opacity:.75}
  .bar .b-dwell{background:var(--aurora);opacity:.8}

  /* 附近還有：day 的 nearby。比 .budget 與景點都輕，文字對齊景點名稱 */
  .near-toggle{
    display:inline-flex;align-items:center;gap:4px;
    margin-left:22px;padding:6px 10px;
    font-family:inherit;font-size:var(--t-xs);
    color:var(--text-4);background:transparent;border:0;border-radius:var(--r-sm);cursor:pointer;
    transition:color .16s;
  }
  .near-toggle:hover{color:var(--text-2)}
  .near-toggle:focus-visible,.near-item:focus-visible{outline:2px solid var(--aurora-hi);outline-offset:-2px}
  .near-toggle .ico{--ico:12px;transition:transform var(--dur) var(--ease)}
  .near-toggle[aria-expanded="true"] .ico{transform:rotate(90deg)}
  .near-list{list-style:none;margin:0;padding:0}
  .near-item{
    display:block;width:100%;text-align:left;
    padding:6px 10px 6px 31px;
    font-family:inherit;color:inherit;
    background:transparent;border:1px solid transparent;border-radius:var(--r-sm);cursor:pointer;
    transition:background .16s,border-color .16s;
  }
  .near-item:hover{background:var(--surface-3);border-color:var(--line)}
  .near-name{font-size:var(--t-sm);font-weight:500;color:var(--text-2)}
  .near-zh{margin-left:6px;font-size:var(--t-xs);color:var(--text-4)}
  .near-why{display:block;font-size:var(--t-xs);line-height:1.6;color:var(--text-4)}
  body.filtering .nearby,body.searching .nearby{display:none}

  /* 只看待決定 */
  .bar-btns{display:flex;gap:6px}
  .ghost-btn[aria-pressed="true"]{
    color:var(--on-aurora);background:var(--aurora);border-color:var(--aurora);
  }
  .ghost-btn[aria-pressed="true"]:hover{
    color:var(--on-aurora);background:var(--aurora-hi);border-color:var(--aurora-hi);
  }
  body.filtering .day[data-todo="0"],
  body.filtering .day-spots li[data-todo="0"]{display:none}
  body.filtering .day-spots::before{display:none}

  /* 搜尋景點 */
  body.searching .day[data-search="0"],
  body.searching .day-spots li[data-search="0"]{display:none}
  body.searching .day-spots::before{display:none}
  .no-results{padding:24px 8px;text-align:center;color:var(--text-4);font-size:var(--t-sm)}


  /* ---------- Right: map + info ---------- */
  .stage{
    display:flex;flex-direction:column;min-width:0;height:100%;
    overflow-y:auto;
    background:
      radial-gradient(640px 360px at 88% 100%, rgba(138,180,255,.13), transparent 70%),
      radial-gradient(560px 320px at 6% 62%, rgba(69,217,189,.12), transparent 70%),
      var(--sunken);
  }
  .stage-handle{display:none}

  /* 地圖撐滿整個右欄並固定不動；資訊面板蓋在上面，一開始只露出 --peek 高（名稱＋簡介），
     其餘往上捲才會蓋過地圖。--peek 由 setPeek() 依內容量；手機版不用 */
  .stage{--peek:200px}
  .map-box{
    flex:0 0 100%;height:100%;margin-bottom:calc(-1*var(--peek));
    position:sticky;top:0;z-index:1;min-height:280px;
    background:
      repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.012) 14px 28px),
      var(--ink-900);
  }
  /* z-index 要壓過 .route-map，不然載入中／載入失敗的訊息被地圖底色蓋住 */
  .map-ph{
    position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;
    color:var(--text-4);font-size:var(--t-sm);pointer-events:none;
  }
  .map-ph{transition:opacity .35s var(--ease)}
  .map-ph .ico{--ico:26px;opacity:.55}
  .map-toolbar{
    position:absolute;top:12px;left:12px;z-index:5;
    display:flex;flex-wrap:wrap;align-items:center;gap:3px;
    background:rgba(7,10,15,.82);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:4px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:var(--shadow-1);
  }
  .map-toolbar button{
    background:transparent;border:0;color:var(--text-3);
    font-family:inherit;font-size:var(--t-sm);font-weight:500;padding:5px 11px;
    border-radius:6px;cursor:pointer;
    transition:color .16s,background .16s;
  }
  .map-toolbar button:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .map-toolbar button.on{background:var(--aurora);color:var(--on-aurora);font-weight:600}
  .map-toolbar .divider{width:1px;height:18px;background:var(--line);margin:0 2px}
  .map-toolbar #btnRoute{display:inline-flex;align-items:center;gap:6px}
  .map-toolbar #btnRoute .ico{--ico:14px}
  .map-open{
    position:absolute;bottom:calc(12px + var(--peek));left:12px;z-index:5;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(7,10,15,.85);border:1px solid var(--line);
    color:var(--text-2);text-decoration:none;font-size:var(--t-sm);font-weight:500;
    padding:7px 12px;border-radius:var(--r-sm);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:var(--shadow-1);
    transition:color .16s,border-color .16s;
  }
  .map-open .ico{--ico:14px}
  .map-open:hover{border-color:var(--aurora-45);color:var(--aurora-hi)}

  .info{
    position:relative;z-index:4;
    flex:1 1 auto;
    border-top:1px solid var(--line);
    background:rgba(12,18,26,.36);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    padding:20px 24px 28px;
  }

  .info-empty{
    min-height:220px;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:9px;text-align:center;color:var(--text-4);
  }
  .info-empty .ico{--ico:34px;color:var(--line-2)}
  .info-empty .lead{font-size:var(--t-md);color:var(--text-3);font-weight:500}
  .info-empty .hint{font-size:var(--t-sm);max-width:34em}

  /* The one authored moment: a selected spot rises into place */
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .rise{animation:rise .52s var(--ease) both}
  .rise-2{animation-delay:.05s}
  .rise-3{animation-delay:.1s}

  .i-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .i-head h2{text-shadow:0 1px 10px rgba(0,0,0,.75);margin:0;font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em;line-height:1.25}
  .i-zh{color:var(--aurora);font-size:var(--t-md);font-weight:500}
  /* 右上角：Google 地圖的景點頁 */
  .i-gmap{
    margin-left:auto;align-self:center;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;
    font-size:var(--t-sm);font-weight:500;color:var(--aurora-hi);text-decoration:none;
    border:1px solid var(--aurora-28);background:var(--aurora-08);
    padding:5px 11px;border-radius:var(--r-sm);transition:background .16s,border-color .16s;
  }
  .i-gmap:hover{background:var(--aurora-14);border-color:var(--aurora-45)}
  .i-gmap .ico{--ico:14px}
  /* 桌面版收合：只留名稱列，地圖露出來。手機版的收合在 .stage 位移，不在這裡 */
  .i-collapse{align-self:center}
  .collapse-btn .lbl-closed{display:none}
  body.stage-collapsed .collapse-btn .lbl-open{display:none}
  body.stage-collapsed .collapse-btn .lbl-closed{display:inline}
  @media (min-width:941px){
    body.stage-collapsed .info > :not(.i-head){display:none}
    body.stage-collapsed .i-head{margin-bottom:0}
    .info .collapse-btn .ico{transition:transform var(--dur) var(--ease)}
    body.stage-collapsed .info .collapse-btn .ico{transform:rotate(180deg)}
  }
  .i-desc{
    margin:0 0 14px;padding:11px 14px;
    border-left:2px solid var(--aurora-45);
    border-radius:0 var(--r-sm) var(--r-sm) 0;
    background:linear-gradient(var(--aurora-08),var(--aurora-08)),rgba(12,18,26,.4);
    font-size:var(--t-md);line-height:1.85;color:var(--text);
  }
  .i-facts{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:1px;margin:0 0 14px;
    background:var(--line);border:1px solid var(--line);
    border-radius:var(--r-sm);overflow:hidden;
  }
  .i-facts>div{background:rgba(17,25,37,.6);padding:9px 12px}
  .i-facts dt{font-size:var(--t-xs);color:var(--text-4);letter-spacing:.06em}
  .i-facts dd{margin:3px 0 0;font-size:var(--t-sm);line-height:1.7;color:var(--text-2)}
  .i-dwell{color:var(--text-3);font-size:var(--t-sm);white-space:nowrap}
  .i-highs{
    margin:0 0 14px;padding:9px 12px;
    background:rgba(17,25,37,.6);border:1px solid var(--line);border-radius:var(--r-sm);
  }
  .i-highs h3{margin:0;font-size:var(--t-xs);font-weight:400;color:var(--text-4);letter-spacing:.06em}
  .i-highs ul{list-style:none;margin:0;padding:0}
  .i-highs li{margin-top:6px;font-size:var(--t-sm);line-height:1.7;color:var(--text-3)}
  .i-highs b{font-weight:600;color:var(--text-2)}
  .i-highs .min{margin-left:6px;font-size:var(--t-xs);color:var(--text-4);white-space:nowrap}
  .i-highs .d{display:block}

  .gallery{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;max-width:1120px;
  }
  .ph{
    position:relative;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;
    background:var(--surface);border:1px solid var(--line);
  }
  .ph button.shot{
    display:block;width:100%;height:100%;padding:0;border:0;
    background:transparent;cursor:zoom-in;
  }
  .ph button.shot:focus-visible{outline:2px solid var(--aurora-hi);outline-offset:-3px}
  .ph img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .5s var(--ease),transform .45s var(--ease);
  }
  .ph img.ready{opacity:1}
  .ph:hover img.ready{transform:scale(1.05)}
  .ph .cred{
    position:absolute;left:0;right:0;bottom:0;
    background:linear-gradient(transparent,rgba(4,7,11,.86));
    color:var(--ink-200);font-size:var(--t-xs);padding:18px 9px 7px;
    text-decoration:none;transition:color .18s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .ph .cred:hover{color:#fff}
  .ph.skel{
    background:linear-gradient(100deg,var(--surface) 30%,var(--surface-3) 50%,var(--surface) 70%);
    background-size:220% 100%;animation:sh 1.4s var(--ease) infinite;
  }
  @keyframes sh{from{background-position:180% 0}to{background-position:-80% 0}}

  .gal-msg{
    grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);padding:15px 17px;max-width:44em;
  }
  .gal-msg .ico{--ico:20px;color:var(--text-4);margin-top:2px}
  .gal-msg b{display:block;font-size:var(--t-sm);color:var(--text-2);margin-bottom:3px}
  .gal-msg p{margin:0 0 10px;font-size:var(--t-sm);color:var(--text-4);line-height:1.7}
  .gal-msg a{
    display:inline-flex;align-items:center;gap:6px;
    font-size:var(--t-sm);font-weight:500;color:var(--aurora-hi);text-decoration:none;
    border:1px solid var(--aurora-28);background:var(--aurora-08);
    padding:6px 11px;border-radius:var(--r-sm);
    transition:background .16s,border-color .16s;
  }
  .gal-msg a:hover{background:var(--aurora-14);border-color:var(--aurora-45)}
  .gal-msg a .ico{--ico:14px;color:inherit;margin:0}
  .gal-more{
    grid-column:1/-1;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;
    font-size:var(--t-sm);color:var(--text-4);
  }
  .gal-more a{display:inline-flex;align-items:center;gap:4px;color:var(--aurora-hi);text-decoration:none}
  .gal-more a:hover{text-decoration:underline}
  .gal-more .ico{--ico:12px}

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:200;
    background:rgba(4,6,10,.93);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,44px);
  }
  .lightbox.on{display:flex;animation:fade .28s var(--ease) both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .lb-fig{
    margin:0;display:flex;flex-direction:column;align-items:center;gap:11px;
    max-width:100%;max-height:100%;
  }
  .lb-fig img{
    max-width:100%;max-height:calc(100dvh - 150px);min-height:0;object-fit:contain;
    border-radius:var(--r-sm);box-shadow:var(--shadow-2);
    animation:rise .4s var(--ease) both;
  }
  .lb-cap{
    font-size:var(--t-sm);color:var(--text-3);text-align:center;max-width:60ch;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
  }
  .lb-cap a{color:var(--aurora-hi);text-decoration:none;border-bottom:1px solid var(--aurora-28)}
  .lb-cap .n{color:var(--text-4);font-variant-numeric:tabular-nums}
  .lb-btn{
    position:absolute;z-index:2;
    display:flex;align-items:center;justify-content:center;
    width:42px;height:42px;padding:0;
    background:rgba(17,25,37,.8);border:1px solid var(--line);
    color:var(--text-2);border-radius:50%;cursor:pointer;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:color .16s,border-color .16s,background .16s;
  }
  .lb-btn .ico{--ico:20px}
  .lb-btn:hover{color:var(--text);background:var(--surface-3);border-color:var(--line-2)}
  .lb-x{top:18px;right:18px}
  .lb-prev{left:16px;top:50%;transform:translateY(-50%)}
  .lb-next{right:16px;top:50%;transform:translateY(-50%)}
  .lb-btn[hidden]{display:none}

  /* ---------- Mobile ---------- */
  @media (max-width:940px){
    .itin-head h1{font-size:var(--t-md)}
    .legend{font-size:var(--t-xs);gap:4px 11px}

    .wrap{grid-template-columns:1fr;height:auto}
    .itinerary{
      border-right:0;padding:14px 12px calc(48vh + 24px);
    }
    body.stage-collapsed .itinerary{padding-bottom:84px}

    .stage{
      position:fixed;left:0;right:0;bottom:0;z-index:60;
      height:48vh;
      background:
        radial-gradient(520px 300px at 90% 100%, rgba(138,180,255,.12), transparent 70%),
        rgba(7,10,15,.9);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-top:1px solid var(--line-2);
      border-radius:var(--r-lg) var(--r-lg) 0 0;
      box-shadow:var(--shadow-sheet);
      transition:transform var(--dur) var(--ease);
    }
    body.stage-collapsed .stage{transform:translateY(calc(48vh - 56px))}

    /* 選了景點：詳細資訊蓋滿整個畫面，收合後退回底部 56px 的把手 */
    body.spot-on .stage{
      top:0;height:100vh;height:100dvh;border-radius:0;
    }
    body.spot-on .stage-handle{border-radius:0}
    body.spot-on.stage-collapsed .stage{
      transform:translateY(calc(100vh - 56px));
      transform:translateY(calc(100dvh - 56px));
    }

    .stage-handle{
      display:flex;align-items:center;gap:10px;
      flex:0 0 auto;padding:9px 10px 9px 16px;
      border-bottom:1px solid var(--line);
      background:rgba(17,25,37,.8);
      border-radius:var(--r-lg) var(--r-lg) 0 0;
      position:sticky;top:0;z-index:2;
    }
    .stage-handle::before{
      content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
      width:34px;height:3px;border-radius:99px;background:var(--line-2);
    }
    .stage-cur{
      flex:1;min-width:0;font-size:var(--t-sm);font-weight:600;color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .stage-cur.empty{color:var(--text-4);font-weight:400}
    .collapse-btn{flex:0 0 auto}
    .collapse-btn .ico{transition:transform var(--dur) var(--ease)}
    body.stage-collapsed .collapse-btn .ico{transform:rotate(180deg)}

    /* 沒選景點時地圖只佔 190px；選了景點，跟桌面一樣：地圖撐滿，
       資訊面板半透明蓋在下緣（--hh = 把手高度，地圖釘在把手下方） */
    .stage{--peek:0px;--hh:49px}
    .map-box{position:relative;height:190px;flex:0 0 auto;min-height:0;margin-bottom:0}
    body.spot-on .map-box{
      position:sticky;top:var(--hh);
      height:calc(100% - var(--hh));min-height:280px;
      margin-bottom:calc(-1*var(--peek));
    }
    .info{padding:16px 16px 22px}
    .i-head h2{font-size:var(--t-lg)}
    .i-head{gap:8px}
    .i-gmap{margin-left:0}
    .i-collapse{display:none}
    .i-desc{padding:10px 12px}
    .i-facts{grid-template-columns:1fr}
    .list-bar{flex-wrap:wrap}
    .bar-btns{flex:1 1 100%}
    .bar-btns .ghost-btn{flex:1 1 0;justify-content:center}
    .gallery{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .lb-prev{left:8px}
    .lb-next{right:8px}
    .lb-x{top:10px;right:10px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important;
    }
  }
  /* ---------- 唯一的地圖：Leaflet ---------- */
  .route-map{position:absolute;inset:0;z-index:2;background:var(--ink-900)}
  .route-map.dim .leaflet-tile-pane{
    filter:invert(1) hue-rotate(180deg) saturate(.62) brightness(.84) contrast(1.06);
  }
  .leaflet-container{background:var(--ink-900);font-family:inherit}
  .leaflet-bar,.leaflet-bar a{
    background:rgba(7,10,15,.86);color:var(--text-2);border-color:var(--line);
  }
  .leaflet-bar a:hover{background:var(--surface-2);color:var(--text)}
  .leaflet-control-attribution{
    background:rgba(7,10,15,.74)!important;color:var(--text-4);font-size:10px;
  }
  .leaflet-control-attribution a{color:var(--text-3)}
  .leaflet-bottom{bottom:var(--peek)}
  .day-pin{
    display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
    font-size:11px;font-weight:700;letter-spacing:-.3px;
    color:var(--on-aurora);border:1.5px solid rgba(7,10,15,.85);
    box-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{
    background:rgba(17,25,37,.48);color:var(--text-2);
    border:1px solid rgba(90,115,150,.45);box-shadow:var(--shadow-2);
    backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
    text-shadow:0 1px 6px rgba(0,0,0,.7);
  }
  .leaflet-popup-content-wrapper{border-radius:var(--r-md)}
  .leaflet-popup-content{margin:11px 13px;font-size:var(--t-sm);line-height:1.55}
  .leaflet-popup-close-button{color:var(--text-4)!important}
  .pop-h{display:block;font-size:var(--t-md);color:var(--text);font-weight:600}
  .pop-zh{display:block;color:var(--text-4);font-size:var(--t-xs);margin-bottom:6px}
  .pop-zh:has(+ .pop-fuel){margin-bottom:2px}
  .pop-fuel{display:block;color:var(--text-4);font-size:var(--t-xs)}
  .pop-links{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pop-links a{
    font-size:var(--t-xs);text-decoration:none;
    background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
    padding:4px 8px;border-radius:6px;
  }
  .pop-links a:hover{border-color:var(--aurora-45);color:var(--aurora-hi)}

  .route-note{font-size:var(--t-sm);color:var(--text-4);margin:12px 0 0;line-height:1.65}
  /* ---------- 編輯行程：候選景點、草稿變更、更新行程 ---------- */
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .edit-btn{flex:none}
  .edit-btn:disabled{opacity:.5;cursor:default}
  .edit-btn:disabled:hover{color:var(--text-3);border-color:var(--line);background:transparent}
  .edit-btn.has{color:#1d1503;background:var(--sulphur);border-color:var(--sulphur);font-weight:600}
  .edit-btn.has:hover{color:#1d1503;background:#f7c868;border-color:#f7c868}
  .edit-n{
    min-width:18px;padding:0 5px;border-radius:99px;text-align:center;
    font-size:var(--t-xs);line-height:18px;font-variant-numeric:tabular-nums;
    background:rgba(0,0,0,.18);
  }
  .badge.draft{background:rgba(242,181,68,.12);color:var(--sulphur);border-color:rgba(242,181,68,.32)}
  .chip.draft{color:var(--sulphur);background:rgba(242,181,68,.09);border-color:rgba(242,181,68,.28)}
  .day.open .chip.draft{background:rgba(242,181,68,.09)}

  .plan{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    margin:0 0 14px;padding:10px 12px;
    background:rgba(17,25,37,.6);border:1px solid var(--line);border-radius:var(--r-sm);
  }
  .plan label{font-size:var(--t-xs);color:var(--text-4);letter-spacing:.06em}
  .plan select{
    flex:1 1 240px;min-width:0;font-family:inherit;font-size:var(--t-sm);color:var(--text);
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;
  }
  .plan select:focus{outline:none;border-color:var(--aurora-45)}
  .plan-go{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:var(--t-sm);font-weight:600;text-decoration:none;
    color:var(--on-aurora);background:var(--aurora);
    border:1px solid var(--aurora);border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;
  }
  .plan-go:hover{background:var(--aurora-hi);border-color:var(--aurora-hi)}
  .plan-go:disabled{opacity:.45;cursor:default;background:var(--aurora)}
  .plan-go .ico{--ico:14px}
  .i-desc .src{margin-left:6px;font-size:var(--t-xs);color:var(--text-4);text-decoration:none;border-bottom:1px solid var(--line-2)}
  .i-desc .src:hover{color:var(--aurora-hi)}
  .i-desc.wait{color:var(--text-4)}

  .leaflet-tooltip.place-tip{
    background:rgba(7,10,15,.78);color:var(--text-2);border:1px solid var(--line);
    font-family:inherit;font-size:var(--t-xs);padding:1px 6px;border-radius:5px;box-shadow:none;
  }
  .leaflet-tooltip.place-tip::before{display:none}

  /* 搜尋時：還沒排進行程的地點 */
  .pool-hits{list-style:none;margin:4px 0 0;padding:0}
  .pool-hits h3{margin:6px 4px 6px;font-size:var(--t-xs);font-weight:600;color:var(--text-4);letter-spacing:.06em}
  .pool-hits .spot .dot{background:var(--ink-200);outline-color:rgba(194,209,226,.14)}
  .pool-hits .spot.removed .dot{background:var(--surface);outline:2px solid var(--sulphur)}

  /* 右側：變更清單 */
  .changes{list-style:none;display:flex;flex-direction:column;gap:8px;margin:14px 0 0;padding:0}
  .change{
    display:flex;align-items:center;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;
  }
  .change-k{
    flex:none;font-size:var(--t-xs);font-weight:700;padding:1px 7px;border-radius:99px;
    color:var(--sulphur);background:rgba(242,181,68,.1);border:1px solid rgba(242,181,68,.3);
  }
  .change-k.rm{color:var(--ember);background:rgba(255,145,102,.1);border-color:rgba(255,145,102,.3)}
  .change-t{flex:1;min-width:0;font-size:var(--t-sm);color:var(--text-3);line-height:1.6}
  .change-t b{color:var(--text);font-weight:600}
  .change-t button{all:unset;cursor:pointer;color:var(--text);font-weight:600;border-bottom:1px solid var(--line-2)}
  .change-t button:hover{color:var(--aurora-hi)}
  .send{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 0}
  .send-note{flex:1 1 100%;margin:0;font-size:var(--t-xs);color:var(--text-4);line-height:1.7}
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10.5 3.6a1.5 1.5 0 0 1 3 0v6.3l7.5 4.3v2.3l-7.5-2.3v3.9l2.5 1.9V22l-4-1.1-4 1.1v-1.9l2.5-1.9v-3.9L3 16.5v-2.3l7.5-4.3z"/></symbol>

  <symbol id="i-map" viewBox="0 0 24 24"><path d="m9 4-6 2.8v13.1l6-2.8 6 2.8 6-2.8V4l-6 2.8z"/><path d="M9 4v13.1"/><path d="M15 6.8v13.1"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m20 20-4.6-4.6"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-1.9 4.9-4.9 1.9 1.9-4.9z"/></symbol>
</defs></svg>

<div class="wrap">
  <!-- ============ LEFT ============ -->
  <aside class="itinerary scroller" id="itin">
    <header class="itin-head">

/* =========================================================
   草稿：在地圖上加入、移除、換天，存在 localStorage，「更新行程」送成 GitHub Issue
   景點落在當天的哪個位置不用選：取直線距離插入成本最低的那一格（含前一晚與隔天第一站）。
   ========================================================= */
const BASE_SPOTS = DAYS.map(d => d.spots.slice());   // 原始行程，草稿每次都從這裡重放
const BASE_DAY = new Map();                               // 原始景點 -> 第幾天
DAYS.forEach(d => d.spots.forEach(s => BASE_DAY.set(s, d.n)));
const BASE_ALL = BASE_SPOTS.flat();

// 景點的鍵：原有的用名稱（KEF 頭尾各一個，補上天數）；從地圖加的用 Wikidata Q 號
const keyOf = s => !BASE_DAY.has(s) ? s.wd
  : BASE_ALL.filter(x => x.name === s.name).length > 1 ? `${s.name}@${BASE_DAY.get(s)}` : s.name;

// 鍵 -> {spot, place}：原有景點 + places.json 裡沒對上任何原有景點的地點（spot 用到才建）
const POOL = new Map(BASE_ALL.map(s => [keyOf(s), {spot:s, place:null}]));
let placesReady = false;
// day.nearby 的鍵 -> 項目；loadPlaces() 把它們放進 POOL，所以灰點、搜尋與草稿走同一條路
const NEARBY = new Map(DAYS.flatMap(d => (d.nearby || []).map(n => [n.wd, n])));

const EDITS_KEY = 'iceland-trip:edits:v3';
let EDITS = [];   // [[鍵, 第幾天]]，0 = 移除；同一個景點只留最後一筆
try{ EDITS = JSON.parse(localStorage.getItem(EDITS_KEY) || '[]') || []; }catch(e){}
let PLANNED = new Set(BASE_ALL);
const TOUCHED = new Set();   // 有變更的天

const dayIndexOf = s => DAYS.findIndex(d => d.spots.includes(s));

function spotFor(e){
  const p = e.place;
  return e.spot ||= {name:p.name, zh:p.zh || '', lat:p.lat, lng:p.lng, z:15,
    q:`${p.wiki || p.name} Iceland`, wiki:p.wiki, type:p.type, desc:'', wd:p.id};
}

// 把 s 插進第 i 天（0 起算）：試每一格，取「繞進來多出的直線距離」最小的
function bestSlot(i, s){
  const sp = DAYS[i].spots.filter(x => x !== s);
  const prev = DAYS[i-1]?.spots.filter(x => x !== s).at(-1);
  const next = DAYS[i+1]?.spots.filter(x => x !== s)[0];
  let best = {at:0, cost:Infinity};
  for(let at = 0; at <= sp.length; at++){
    const a = sp[at-1] || prev, b = sp[at] || next;
    const cost = (a ? geoKm(a, s) : 0) + (b ? geoKm(s, b) : 0) - (a && b ? geoKm(a, b) : 0);
    if(cost < best.cost) best = {at, cost, a:sp[at-1], b:sp[at]};
  }
  return best;
}

function applyEdits(){
  DAYS.forEach((d, i) => d.spots = BASE_SPOTS[i].slice());
  const hit = new Set();
  EDITS = EDITS.filter(([k, day]) => {
    const e = POOL.get(k);
    if(!e) return !placesReady;          // places.json 還沒到：先留著
    if(day && !DAYS[day-1]) return false;
    const s = spotFor(e), from = dayIndexOf(s);
    if(day === from + 1) return false;   // 跟現況一樣（例如這筆變更已經上線）
    if(from >= 0){
      if(DAYS[from].spots.length === 1) return false;   // 一天至少留一站
      DAYS[from].spots.splice(DAYS[from].spots.indexOf(s), 1);
      hit.add(from);
    }
    if(day){
      DAYS[day-1].spots.splice(bestSlot(day-1, s).at, 0, s);
      hit.add(day-1);
    }
    return true;
  });
  TOUCHED.clear();
  hit.forEach(i => TOUCHED.add(DAYS[i]));
  PLANNED = new Set(DAYS.flatMap(d => d.spots));
  try{ localStorage.setItem(EDITS_KEY, JSON.stringify(EDITS)); }catch(e){}
}

// day：第幾天，0 = 移除。回到原本那天就等於撤銷
function setDay(s, day){
  const k = keyOf(s);
  EDITS = EDITS.filter(([x]) => x !== k);
  if(day !== (BASE_DAY.get(s) || 0)) EDITS.push([k, day]);
  applyEdits();
}

// 列表上的標記：新加的、從別天移來的
const draftTag = s => !BASE_DAY.has(s) ? '新增'
  : BASE_DAY.get(s) !== dayIndexOf(s) + 1 ? '移入' : '';

applyEdits();   // 先放原有景點的變更；從地圖加的要等 places.json

/* =========================================================
   決策輔助：體驗類型、同類計數、單日負荷
   ========================================================= */
const TYPES = {
  waterfall:"瀑布", glacier:"冰川", geothermal:"地熱", bath:"溫泉池", coast:"海岸",
  canyon:"峽谷", volcanic:"火山地形", geology:"地質", wildlife:"野生動物",
  hike:"健行", view:"景觀點", culture:"人文", town:"城鎮", food:"飲食", transit:"交通"
};

/* 每個景點是全程同類型的第幾個 —— 讓「一天五個城鎮」這種重複直接現形。站序一變就要重算 */
const TYPE_TOTAL = {};
const TYPE_SEQ = new Map();
function indexTypes(){
  Object.keys(TYPE_TOTAL).forEach(k => delete TYPE_TOTAL[k]);
  TYPE_SEQ.clear();
  DAYS.forEach(d=>d.spots.forEach(s=>{
    if(s.type) TYPE_SEQ.set(s, TYPE_TOTAL[s.type] = (TYPE_TOTAL[s.type]||0) + 1);
  }));
}

/* 待決定 = 需要事先預約；已用 fixed 定案的不算（預約仍要訂，但不必再決定） */
const isTodo = s => Boolean(s.book && !s.fixed);

const hhmm = m => m < 60 ? `${m} 分`
  : (m % 60 ? `${Math.floor(m/60)} 小時 ${m%60} 分` : `${m/60} 小時`);
const hrs = h => `${h.toFixed(1)} 小時`;

/* 單日負荷：淨車程（見 review.html 的里程表）+ 已估算的停留時間。
   長條圖固定 12 小時刻度，所有天共用同一把尺，可直接互比。 */
const BAR_H = 12;
function budgetHtml(day){
  const known = day.spots.filter(s=>s.dwell);
  const dwell = known.reduce((n,s)=>n + s.dwell, 0) / 60;
  const drive = day.drive || 0;
  const w = h => Math.min(100, h / BAR_H * 100).toFixed(1);
  const full = known.length === day.spots.length;

  const stay = known.length
    ? `<span class="key k-dwell">停留 <b>${hrs(dwell)}</b>${
        full ? '' : `（${day.spots.length} 個中 ${known.length} 個已估）`}</span>
       <span>合計 <b class="tot">${hrs(drive + dwell)}</b></span>`
    : `<span class="key k-dwell">停留時間尚未估算</span>`;

  return `<div class="budget">
    <span class="key k-drive">淨車程 <b>${day.drive == null ? '—' : hrs(day.drive)}</b></span>
    ${stay}
    <span>${day.km} km</span>
    ${TOUCHED.has(day) ? '<span class="chip draft">車程與里程為變更前</span>' : ''}
    <span class="bar" aria-hidden="true">
      <i class="b-drive" style="width:${w(drive)}%"></i>
      <i class="b-dwell" style="width:${w(dwell)}%"></i>
    </span>
  </div>`;
}

/* ================= 建立左側列表 ================= */
const dayList = document.getElementById('dayList');
let uid = 0;
const REG = {};   // id -> spot
const IDS = new Map();   // spot -> id（地圖圖釘點回左側用）

const icon = id => `<svg class="ico" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc = str => String(str).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 排進草稿的地點就不算「附近還有」，要等 POOL 有它才判斷得出來
function nearbyHtml(day){
  const near = (day.nearby || []).filter(n => !PLANNED.has(POOL.get(n.wd)?.spot));
  if(!near.length) return '';
  const id = 'near' + day.n;
  return `<div class="nearby">
    <button type="button" class="near-toggle" aria-expanded="false" aria-controls="${id}">附近還有 ${near.length} 處${icon('i-chev-r')}</button>
    <ul class="near-list" id="${id}" hidden>${near.map(n => `<li>
      <button type="button" class="near-item" data-k="${esc(n.wd)}">
        <span class="near-name">${esc(n.name)}</span><span class="near-zh">${esc(n.zh)}</span>
        <span class="near-why">${esc(n.why)}</span>
      </button></li>`).join('')}</ul>
  </div>`;
}

function renderDay(day){
  const el = document.createElement('li');
  const open = day.open || day.n===1;
  el.className = 'day' + (open ? ' open' : '');
  const di = DAYS.indexOf(day);
  if(di >= 0) el.style.setProperty('--day-c', dayColor(di));
  const bodyId = 'dayBody' + (day.key || day.n);

  el.innerHTML = `
    <h2 style="margin:0;font-size:inherit;font-weight:inherit">
      <button type="button" class="day-head" aria-expanded="${open}" aria-controls="${bodyId}">
        <span class="day-no">${day.label || `DAY ${day.n}`}</span>
        <span class="day-main">
          <span class="day-title">${day.title}</span>
          <span class="day-meta">
            ${day.date ? `<span class="day-date">${day.date}</span>` : ''}
            ${TOUCHED.has(day) ? '<span class="chip draft">已修改</span>' : ''}
          </span>
        </span>
        ${icon('i-chev-r').replace('class="ico"','class="ico chev"')}
      </button>
    </h2>
    <div class="day-body" id="${bodyId}">
      <div class="day-body-inner"><div class="day-body-pad">
        <p class="day-note">${day.note}</p>
        ${day.km ? budgetHtml(day) : ''}
        <ul class="day-spots"></ul>
        ${nearbyHtml(day)}
      </div></div>
    </div>`;

  const list = el.querySelector('.day-spots');
  el.dataset.todo = day.spots.some(isTodo) ? '1' : '0';
  day.spots.forEach(s=>{
    const id = 's'+(uid++);
    REG[id] = s;
    IDS.set(s, id);
    const li = document.createElement('li');
    li.dataset.todo = isTodo(s) ? '1' : '0';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'spot' + (s.kind==='city'?' city':'');
    b.dataset.id = id;
    const meta = [
      s.type  ? `<span class="chip type">${TYPES[s.type]}</span>` : '',
      s.dwell ? `<span class="chip">停留 ${hhmm(s.dwell)}</span>` : '',
      s.fixed ? '<span class="chip fixed">已確定</span>' : '',
      s.book  ? '<span class="chip book">需預約</span>' : ''
    ].join('');
    b.innerHTML = `
      <span class="dot" aria-hidden="true"></span>
      <span class="spot-txt">
        <span class="spot-name">${s.name}${
          draftTag(s) ? `<span class="badge draft">${draftTag(s)}</span>` : ''}</span>
        <span class="spot-zh">${s.zh}</span>
        ${meta ? `<span class="s-meta">${meta}</span>` : ''}
      </span>`;
    b.addEventListener('click', ()=>select(id));
    li.appendChild(b);
    list.appendChild(li);
  });

  const head = el.querySelector('.day-head');
  head.addEventListener('click', ()=>{
    setDayOpen(el, !el.classList.contains('open'));
    syncToggleAll();
  });
  el.querySelector('.nearby')?.addEventListener('click', e => {
    const toggle = e.target.closest('.near-toggle'), item = e.target.closest('.near-item');
    if(toggle){
      const list = el.querySelector('.near-list');
      list.hidden = !list.hidden;
      toggle.setAttribute('aria-expanded', String(!list.hidden));
    } else if(item) placesLoaded.then(() => showPlace(item.dataset.k, true));
  });
  dayList.appendChild(el);
  return el;
}

const countEl  = document.getElementById('dayCount');
let countAll = '';

function setDayOpen(el, open){
  el.classList.toggle('open', open);
  el.querySelector('.day-head').setAttribute('aria-expanded', String(open));
}

/* ---------- 全部展開 / 收合 ---------- */
const toggleAll = document.getElementById('toggleAll');
const toggleAllLabel = document.getElementById('toggleAllLabel');
const allDays = () => Array.from(dayList.children);
/* 篩選開啟時（待決定／搜尋），「全部展開」只管還看得到的那幾天 */
const shownDays = () => allDays().filter(d=>
  !(document.body.classList.contains('filtering') && d.dataset.todo === '0') &&
  !(document.body.classList.contains('searching') && d.dataset.search === '0'));

function syncToggleAll(){
  const allOpen = shownDays().every(d=>d.classList.contains('open'));
  toggleAll.classList.toggle('all-open', allOpen);
  toggleAll.setAttribute('aria-expanded', String(allOpen));
  toggleAllLabel.textContent = allOpen ? '全部收合' : '全部展開';
}
toggleAll.addEventListener('click', ()=>{
  const open = !shownDays().every(d=>d.classList.contains('open'));
  shownDays().forEach(d=>setDayOpen(d, open));
  syncToggleAll();
});
syncToggleAll();

/* 目前有幾個景點列項（同時套用待決定 + 搜尋兩個篩選） */
function visibleSpotCount(){
  const filtering = document.body.classList.contains('filtering');
  const searching = document.body.classList.contains('searching');
  let n = 0;
  allDays().forEach(d=>d.querySelectorAll('.day-spots > li').forEach(li=>{
    if((!filtering || li.dataset.todo === '1') && (!searching || li.dataset.search === '1')) n++;
  }));
  return n;
}

function updateCount(){
  const filtering = document.body.classList.contains('filtering');
  const searching = document.body.classList.contains('searching');
  if(!filtering && !searching){ countEl.textContent = countAll; return; }
  if(searching){
    countEl.textContent = `找到 ${visibleSpotCount()} 個地點` + (filtering ? '（待決定）' : '');
  } else {
    countEl.textContent = `${todoCount} 個待決定 · 需預約`;
  }
}

/* ---------- 只看待決定：需預約 ---------- */
const onlyTodo  = document.getElementById('onlyTodo');
let todoCount = 0;

onlyTodo.addEventListener('click', ()=>{
  const on = !document.body.classList.contains('filtering');
  document.body.classList.toggle('filtering', on);
  onlyTodo.setAttribute('aria-pressed', String(on));
  updateCount();
  if(on) shownDays().forEach(d=>setDayOpen(d, true));
  syncToggleAll();
});

/* ---------- 搜尋景點：查某個景點是否已排入行程 ---------- */
const spotSearch = document.getElementById('spotSearch');
const spotSearchClear = document.getElementById('spotSearchClear');
const noResults = document.getElementById('noResults');

const searchText = s => [s.name, s.zh, s.desc].filter(Boolean).join(' ').toLowerCase();

function applySearch(){
  const q = spotSearch.value.trim().toLowerCase();
  const searching = q.length > 0;
  document.body.classList.toggle('searching', searching);
  spotSearchClear.hidden = !searching;

  allDays().forEach(d=>{
    let match = false;
    d.querySelectorAll('.day-spots > li').forEach(li=>{
      const btn = li.querySelector('.spot');
      const spot = REG[btn.dataset.id];
      const hit = !searching || searchText(spot).includes(q);
      li.dataset.search = hit ? '1' : '0';
      if(hit) match = true;
    });
    d.dataset.search = match ? '1' : '0';
  });

  const none = !allDays().some(d=>d.dataset.search==='1');
  const pool = renderPoolHits(searching ? q : '');
  noResults.hidden = !(searching && none);
  noResults.textContent = pool ? '行程裡沒有符合的景點' : '沒有符合的景點';
  updateCount();
  if(searching) shownDays().forEach(d=>setDayOpen(d, true));
  syncToggleAll();
}

/* 還沒排進行程的地點（places.json 的候選＋被移除的原有景點）也一起搜，點了就開它的詳細資訊 */
const poolHits = document.getElementById('poolHits');
function renderPoolHits(q){
  const hits = !q ? [] : [...POOL].filter(([, e]) => !(e.spot && PLANNED.has(e.spot)) &&
    [e.spot?.name, e.spot?.zh, e.place?.name, e.place?.zh]
      .some(t => t && t.toLowerCase().includes(q))).slice(0, 12);
  poolHits.hidden = !hits.length;
  poolHits.innerHTML = hits.length ? '<li><h3>未排入行程 · 點開可加入</h3></li>' + hits.map(([k, e]) => {
    const n = e.spot || e.place;
    return `<li><button type="button" class="spot${e.spot && BASE_DAY.has(e.spot) ? ' removed' : ''}" data-k="${esc(k)}">
      <span class="dot" aria-hidden="true"></span>
      <span class="spot-txt"><span class="spot-name">${esc(n.name)}</span>
        <span class="spot-zh">${esc([n.zh, TYPES[n.type]].filter(Boolean).join(' · '))}</span></span>
    </button></li>`;
  }).join('') : '';
  return hits.length;
}
poolHits.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if(b) showPlace(b.dataset.k);
});

spotSearch.addEventListener('input', applySearch);
spotSearchClear.addEventListener('click', ()=>{
  spotSearch.value = '';
  applySearch();
  spotSearch.focus();
});

/* 重建左側列表；搜尋字串與「只看待決定」維持原狀 */
function buildList(){
  dayList.replaceChildren();
  uid = 0;
  Object.keys(REG).forEach(k => delete REG[k]);
  IDS.clear();
  indexTypes();
  DAYS.forEach(renderDay);
  countAll = `${DAYS.length} 天 · ${DAYS.reduce((n,d)=>n+d.spots.length,0)} 個地點`;
  todoCount = DAYS.reduce((n,d)=>n + d.spots.filter(isTodo).length, 0);
  applySearch();
  if(document.body.classList.contains('filtering')) shownDays().forEach(d=>setDayOpen(d, true));
  syncToggleAll();
}
buildList();

/* ================= 地圖 =================
   頁內的 Leaflet 是唯一的地圖。Google 地圖只剩外連按鈕（「在 Google 地圖開啟」、
   當日路線、區域搜尋）—— 點景點不換地圖。 */
// "Sólfar (Sun Voyager)" → "Sun Voyager, Iceland"；"Geysir / Strokkur" → "Geysir, Iceland"
const placeQuery = s => `${titleCandidates(s)[0] || s.name}, Iceland`;

const mapOpen = document.getElementById('mapOpen');
const mapPh   = document.querySelector('.map-ph');
let mapType = 'm';
let current = null;

// 用地點名稱而非座標，Google 才會開在它自己的景點頁（資訊卡、評論、照片）
function setMapOpen(){
  mapOpen.href = current
    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(placeQuery(current))}`
    : 'https://www.google.com/maps/@64.90,-18.60,6z';
}

document.querySelectorAll('.map-toolbar button[data-t]').forEach(b=>{
  b.addEventListener('click', ()=>{

/* ================= 路線 =================
   Google 地圖的路線網址吃 10 個停靠點，16 天的點塞不下，
   所以整段路線在頁內自己畫。Leaflet 連不上就只剩底圖的占位訊息
   —— 沒有第二張地圖可以退回。 */
const LEAFLET = {
  css:['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css',
       'sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw=='],
  js: ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
       'sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==']
};

// 對上工具列的 地圖／衛星／地形；dim = 要不要套深色濾鏡（衛星圖反轉會壞掉）
const TILES = {
  m:{url:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', max:18, dim:true,
     attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'},
  k:{url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
     max:18, dim:false, attr:'Esri · Maxar · Earthstar Geographics'},
  p:{url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', max:16, dim:true,
     attr:'<a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'}
};

const routeEl = document.getElementById('route');
// 16 天 16 個色相；相鄰兩天跳 7 格（約 157°），色相相近的兩天在時間和地理上都離得遠
function dayColor(i){
  const slot = (i*7) % 16;
  return `hsl(${(slot*22.5 + 8) % 360} ${slot%2 ? 78 : 70}% ${slot%2 ? 66 : 58}%)`;
}
const endOf = day => day.spots[day.spots.length-1];
const mmdd  = d => (d || '').replace(/（.*/, '');

function geoKm(a, b){
  const rad = x => x*Math.PI/180, R = 6371;
  const h = Math.sin(rad(b.lat-a.lat)/2)**2 +
            Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lng-a.lng)/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* 路線貼合實際道路：OSRM 的公用 demo server（免 API key、CORS 開放，但沒有
   可用性保證）。每段查一次，結果以該段座標的指紋為鍵存進 localStorage —— 座標
   動過的段落才重查。任何一段查不到就保留該段的直線，地圖不會開天窗。 */
const OSRM = 'https://router.project-osrm.org/route/v1/driving/';
const ROADS_KEY = 'iceland-trip:roads:v5';

/* 彈窗的「距上一站」油費：汽油 RAV4，4 人滿載含行李，偏高估。油價與匯率是概估，出發前再改。 */
const CAR_L100 = 8, FUEL_ISK = 310, ISK_TWD = 0.24;   // L/100 km、ISK/L、NT$/ISK

const LINES = {};        // 'day3' / 'gap3' -> polyline
const PINS  = {};        // 天數索引 -> 該天收尾的圖釘
const LEG_KM = new Map();   // spot -> {km, min, f}：從上一站開過來的路程；f = 該段被導到 F 路

const hash = str => {
  let h = 0;
  for(let i=0; i<str.length; i++) h = (h*31 + str.charCodeAt(i)) | 0;
  return h.toString(36);
};

// 當天的點連成一段，兩天之間自成一段 —— 這樣實線與虛線才各有自己的幾何
function segments(){
  const out = [];
  DAYS.forEach((day, i)=>{
    const pts = [], stops = [];   // pts 是 OSRM 吃的 lng,lat；stops：各景點在 pts 裡的位置，用來把逐段里程對回景點
    // 首站的 via 屬於從前一天開過來的虛線段，不進當天實線
    day.spots.forEach((sp, k) => {
      if(k) (sp.via || []).forEach(([la, ln]) => pts.push([ln, la]));
      stops.push(pts.length);
      pts.push([sp.lng, sp.lat]);
    });
    if(pts.length > 1) out.push({key:'day'+i, i, gap:false, pts, stops});
    const next = DAYS[i+1];
    if(next){
      const a = endOf(day), b = next.spots[0];
      out.push({key:'gap'+i, i, gap:true,
        pts:[[a.lng, a.lat], ...(b.via || []).map(([la, ln]) => [ln, la]), [b.lng, b.lat]]});
    }
  });
  return out;
}

async function osrm(pts){
  // steps 只為了讀 ref：F 字頭是冰島高地道路，季節性封閉又限四驅
  const url = OSRM + pts.map(c => c.join(',')).join(';') +
    '?overview=simplified&geometries=geojson&steps=true';
  const res = await fetch(url);
  if(!res.ok) throw new Error('osrm ' + res.status);
  const json = await res.json();
  if(json.code !== 'Ok' || !json.routes?.length) throw new Error(json.code || 'osrm');
  const rt = json.routes[0];
  return {
    line: rt.geometry.coordinates.map(([lng, lat]) => [+lat.toFixed(5), +lng.toFixed(5)]),
    km:   Math.round(rt.distance/1000),
    legs: rt.legs.map(l => Math.round(l.distance/100)/10),
    legMin: rt.legs.map(l => l.duration/60),
    legF: rt.legs.map(l => l.steps.some(st => (st.ref || '').split(/[;,]/).some(r => /^F\d/i.test(r.trim())))),
    min:  Math.round(rt.duration/60),
    f:    [...new Set(rt.legs.flatMap(l => l.steps)
            .flatMap(st => (st.ref || '').split(/[;,]/))
            .map(r => r.trim())
            .filter(r => /^F\d/i.test(r)))]
  };
}

function applyRoad(seg, d){
  LINES[seg.key]?.setLatLngs(d.line);
  if(!seg.gap){
    for(let k=1; k<seg.stops.length; k++){
      const [a, b] = [seg.stops[k-1], seg.stops[k]];
      LEG_KM.set(DAYS[seg.i].spots[k], {
        km: d.legs.slice(a, b).reduce((x, y) => x + y, 0),
        min: d.legMin.slice(a, b).reduce((x, y) => x + y, 0),
        f:  d.legF.slice(a, b).some(Boolean)
      });
    }
    return;
  }
  LEG_KM.set(DAYS[seg.i+1].spots[0], {km:d.km, min:d.min, f:!!d.f.length});
}

let routeGen = 0;   // 每次重畫 +1；舊一輪還在跑的查詢看到編號變了就收手

async function snapToRoads(){
  const gen = routeGen;
  const segs = segments();
  let store = {};
  try{ store = JSON.parse(localStorage.getItem(ROADS_KEY) || '{}') || {}; }catch(e){}
  try{ localStorage.removeItem('iceland-trip:roads:v4'); }catch(e){}
  if(Object.keys(store).length > 150) store = {};   // 遠多於全程段數，代表有舊座標堆積

  try{
    for(const seg of segs){
      const k = hash(seg.pts.join(';'));
      if(!store[k]){
        try{ store[k] = await osrm(seg.pts); }
        catch(e){ continue; }                        // 這段維持直線
        await new Promise(r => setTimeout(r, 120));  // 公用 server，別連打
      }
      if(gen !== routeGen) return;
      applyRoad(seg, store[k]);
    }
  } finally {
    try{ localStorage.setItem(ROADS_KEY, JSON.stringify(store)); }catch(e){}
  }
}

/* 住宿／加油／超市一律丟回 Google 地圖的區域搜尋，不在行程資料裡預先假定小鎮
   —— 該區到底有什麼，看地圖上實際存在的結果。z 越小搜得越廣。 */
const NEAR = [['住宿','accommodation'], ['加油','petrol station'], ['超市','supermarket']];
const nearUrl = (q, s, z) =>
  `https://www.google.com/maps/search/${encodeURIComponent(q)}/@${s.lat},${s.lng},${z}z`;
/* 住宿改走 Booking.com：Google 地圖的搜尋網址帶不進日期與人數。
   night = 該晚第幾天（DAYS 索引）：入住＝當天，退房＝隔天；最後一天是夜班機，沒有住宿日期。 */
const TRIP_YEAR = 2027, GUESTS = 4, STAY_MAX = 13000;   // STAY_MAX：NT$／晚，Booking 價格篩選上限
const isoDate = (d, plus = 0) => {
  const [m, dd] = mmdd(d).split('/').map(Number);
  return new Date(Date.UTC(TRIP_YEAR, m-1, dd+plus)).toISOString().slice(0, 10);
};
const stayUrl = (s, night) => {
  const q = new URLSearchParams({
    ss: `${s.name}, Iceland`, latitude: s.lat, longitude: s.lng,
    checkin: isoDate(DAYS[night].date), checkout: isoDate(DAYS[night+1].date),
    group_adults: GUESTS, selected_currency: 'TWD', nflt: `price=TWD-min-${STAY_MAX}-1`,
  });
  return `https://www.booking.com/searchresults.html?${q}`;
};
const nearLinks = (s, z, night) => NEAR.map(([t,q]) => {
  const stay = q === 'accommodation' && night != null && DAYS[night+1];
  return stay
    ? `<a href="${stayUrl(s, night)}" target="_blank" rel="noopener" title="Booking.com · ${isoDate(DAYS[night].date)} 入住 · ${GUESTS} 位成人 · 每晚上限 NT$${STAY_MAX.toLocaleString()}">${t}</a>`
    : `<a href="${nearUrl(q, s, z)}" target="_blank" rel="noopener">${t}</a>`;
}).join('');

let rmap = null, rTile = null, leafletReady = null;
let routeLines = null, allPts = [];
const MARKERS = new Map();   // spot -> 該點在地圖上的圖釘

function loadLeaflet(){
  if(leafletReady) return leafletReady;
  return leafletReady = new Promise((ok, fail)=>{
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = LEAFLET.css[0];
    link.integrity = LEAFLET.css[1];
    link.crossOrigin = 'anonymous';
    // 放在 head 最前面，本頁 <style> 的深色覆寫才排在 Leaflet 預設之後
    document.head.prepend(link);
    const sc = document.createElement('script');
    sc.src = LEAFLET.js[0];
    sc.integrity = LEAFLET.js[1];
    sc.crossOrigin = 'anonymous';
    sc.onload = ok;
    sc.onerror = () => fail(new Error('leaflet'));
    document.head.appendChild(sc);
  });
}

/* 唯一的地圖，所以一進頁面就建。 */
const mapReady = loadLeaflet().then(buildRoute).catch(()=>{
  mapPh.querySelector('span').textContent = '地圖元件連不上，請重新整理，或用左下角的 Google 地圖連結';
});

function setTile(){
  if(!rmap) return;
  const t = TILES[mapType] || TILES.m;
  rTile?.remove();
  rTile = L.tileLayer(t.url, {attribution:t.attr, maxZoom:t.max}).addTo(rmap);
  routeEl.classList.toggle('dim', t.dim);
}

// 路線還沒回來時不顯示；該段被導到高地山路的，數字照放但註明僅供參考
function fuelLine(s){
  const r = LEG_KM.get(s);
  if(!r) return '';
  const L = r.km * CAR_L100 / 100;
  const nt = Math.round(L * FUEL_ISK * ISK_TWD / 10) * 10;
  return `<span class="pop-fuel">距上一站 ${Math.round(r.km)} km · 約 ${hrs(r.min/60)} · 油費$${nt.toLocaleString()}${r.f ? ' · 路線僅供參考' : ''}</span>`;
}

function spotPopup(s, night){
  return `<span class="pop-h">${esc(s.name)}</span>
    <span class="pop-zh">${esc(s.zh)}</span>${fuelLine(s)}
    <span class="pop-links">${nearLinks(s, 12, night)}</span>`;
}

function fitAll(){
  const peek = parseInt(getComputedStyle(routeEl).getPropertyValue('--peek')) || 0;
  rmap.fitBounds(allPts, {paddingTopLeft:[24,24], paddingBottomRight:[24, 24+peek]});
}

function buildRoute(){
  // 先給一個視野（全島）：圖層加到還沒定位的地圖上會炸，最後才 fitBounds
  rmap = L.map(routeEl, {worldCopyJump:false, zoomControl:false}).setView([64.90, -18.60], 6);
  L.control.zoom({position:'topright'}).addTo(rmap);   // 左上角是本頁的工具列
  setTile();
  // 線自己一層，「路線」關掉時圖釘不跟著消失
  routeLines = L.layerGroup();
  if(btnRoute.classList.contains('on')) routeLines.addTo(rmap);
  // 候選地點畫在 canvas 上、壓在路線底下；跟著視野重畫，縮小時只留維基語言版多的
  rmap.createPane('places').style.zIndex = 390;
  placeCanvas = L.canvas({pane:'places', padding:.3});
  placeLayer = L.layerGroup().addTo(rmap);
  rmap.on('moveend', drawPlaces);
  drawRoute();
  mapPh.style.opacity = '0';
}

const wipe = o => Object.keys(o).forEach(k => delete o[k]);

// 拆掉舊的線與圖釘，其餘（底圖、視野、工具列）留著
function clearRoute(){
  routeGen++;
  routeLines?.clearLayers();
  MARKERS.forEach(m => m.remove());
  MARKERS.clear();
  [LINES, PINS].forEach(wipe);
  LEG_KM.clear();
  allPts = [];
}

// fit = false：草稿改動後重畫，視野留在原處
function drawRoute(fit = true){
  DAYS.forEach((day, i)=>{
    const c = dayColor(i), end = endOf(day);
    const line = day.spots.map(s => [s.lat, s.lng]);
    allPts.push(...line);
    if(line.length > 1) LINES['day'+i] =
      L.polyline(line, {color:c, weight:3.5, opacity:.95}).addTo(routeLines);

    // 虛線 = 隔天早上的啟程車程，所以用隔天的顏色
    const next = DAYS[i+1];
    if(next) LINES['gap'+i] =
      L.polyline([[end.lat, end.lng], [next.spots[0].lat, next.spots[0].lng]],
        {color:dayColor(i+1), weight:2, opacity:.55, dashArray:'4 7'}).addTo(routeLines);

    day.spots.forEach(s=>{
      if(s === end) return;
      MARKERS.set(s, L.circleMarker([s.lat, s.lng],
        {radius:4, color:c, weight:1.5, fillColor:'#070a0f', fillOpacity:.9})
        .addTo(rmap).bindPopup(()=>spotPopup(s, i)));
    });

    PINS[i] = L.marker([end.lat, end.lng], {
      zIndexOffset:400,
      title:`DAY ${day.n} ${end.name}`,
      icon:L.divIcon({className:'', iconSize:[22,22], iconAnchor:[11,11],
        html:`<span class="day-pin" style="background:${c}">${day.n}</span>`})
    }).addTo(rmap).bindPopup(()=>spotPopup(end, i));
    MARKERS.set(end, PINS[i]);
  });

  // 地圖上點一下等於在左側點那個景點；視野留在原處，只開 popup
  MARKERS.forEach((m, s) => m.on('click', ()=>{ if(IDS.has(s)) select(IDS.get(s), true); }));

  if(fit) fitAll();
  drawPlaces();
  snapToRoads();   // 先直線上畫面，再逐段換成實際道路
}

/* ---------- 候選地點：不在行程裡的灰點；被移出行程的原有景點是黃圈，任何縮放都畫 ---------- */
let placeLayer = null, placeCanvas = null;
const MIN_SL = z => z <= 6 ? 30 : z === 7 ? 20 : z === 8 ? 12 : z === 9 ? 6 : z === 10 ? 3 : z === 11 ? 1 : 0;
const DOT = {
  plain:{radius:4, color:'#070a0f', weight:1, opacity:.35, fillColor:'#c2d1e2', fillOpacity:.4},
  removed:{radius:5, color:'#f2b544', weight:2, opacity:.9, fillColor:'#0c121a', fillOpacity:.9},
  focus:{radius:6, color:'#45d9bd', weight:2, opacity:1, fillColor:'#0c121a', fillOpacity:.9}
};

function drawPlaces(){
  if(!placeLayer) return;
  placeLayer.clearLayers();
  const z = rmap.getZoom(), min = MIN_SL(z), view = rmap.getBounds().pad(.25);
  POOL.forEach((e, k) => {
    if(e.spot && PLANNED.has(e.spot)) return;
    const removed = Boolean(e.spot && BASE_DAY.has(e.spot));
    const focus = Boolean(current) && e.spot === current;   // 面板開著的地點不受 MIN_SL 稀疏化影響
    if(!removed && !focus && (e.place?.sl ?? 0) < min) return;
    const n = e.spot || e.place, ll = [n.lat, n.lng];
    if(!view.contains(ll)) return;
    L.circleMarker(ll, {renderer:placeCanvas, ...(removed ? DOT.removed : focus ? DOT.focus : DOT.plain)})
      .bindTooltip(esc(n.zh && n.zh !== n.name ? `${n.zh} ${n.name}` : n.name),
        {permanent:z >= 11, direction:'right', offset:[6, 0], className:'place-tip', opacity:removed ? .9 : .6})
      .on('click', () => showPlace(k))
      .addTo(placeLayer);
  });
}

const EMPTY_INFO = document.getElementById('info').innerHTML;

// 沒選景點的預設右側：地圖退回全島視野，面板回到提示
function showHome(){
  current = null;
  ++reqToken;
  drawPlaces();
  PHOTOS = [];
  document.querySelectorAll('.spot.active').forEach(x=>x.classList.remove('active'));
  setMapOpen();
  document.body.classList.remove('spot-on');

  stageCur.classList.add('empty');
