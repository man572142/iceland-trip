}

const btnRoute = document.getElementById('btnRoute');
btnRoute.addEventListener('click', ()=>{
  const on = !btnRoute.classList.contains('on');
  btnRoute.classList.toggle('on', on);
  btnRoute.setAttribute('aria-pressed', String(on));
  if(rmap && routeLines) on ? routeLines.addTo(rmap) : routeLines.remove();
});

// 收合、轉向、視窗縮放都會改到地圖框的尺寸，Leaflet 要重新量一次
new ResizeObserver(()=>rmap?.invalidateSize())
  .observe(document.querySelector('.map-box'));

// 面板一開始露出的高度 = 上緣到「名稱＋簡介」底部；其餘要往上捲
const peekRO = new ResizeObserver(setPeek);
function setPeek(){
  const head = info.firstElementChild;
  const folded = document.body.classList.contains('stage-collapsed') && matchMedia('(min-width:941px)').matches;
  const next = folded ? head : head?.nextElementSibling;
  if(!head || !next) return;
  const h = next.getBoundingClientRect().bottom - info.getBoundingClientRect().top;
  stage.style.setProperty('--peek', Math.round(Math.min(h + 14, stage.clientHeight * .5)) + 'px');
}
function watchPeek(){
  peekRO.disconnect();
  const head = info.firstElementChild;
  if(!head) return;
  peekRO.observe(head);
  if(head.nextElementSibling) peekRO.observe(head.nextElementSibling);
  setPeek();
}

/* ================= 行動版：底部面板收合 ================= */
const stage = document.querySelector('.stage');
const stageCur = document.getElementById('stageCur');
// 手機把手與桌面名稱列各有一顆收合鈕，共用 body.stage-collapsed
function setCollapsed(c){
  document.body.classList.toggle('stage-collapsed', c);
  document.querySelectorAll('.collapse-btn').forEach(b=>b.setAttribute('aria-expanded', String(!c)));
  setPeek();
}
document.addEventListener('click', e=>{
  if(e.target.closest('.collapse-btn'))
    setCollapsed(!document.body.classList.contains('stage-collapsed'));
});

/* ================= 選取景點 ================= */
const info = document.getElementById('info');
let reqToken = 0;

// keepView：從地圖圖釘點進來的，視野不要再跳
function select(id, keepView){
  const s = REG[id];
  current = s;
  drawPlaces();
  document.querySelectorAll('.spot').forEach(x=>x.classList.toggle('active', x.dataset.id===id));
  setMapOpen();
  if(!keepView) mapReady.then(()=>{
    rmap?.setView([s.lat, s.lng], Math.round((s.z || 14) * 0.75));
    MARKERS.get(s)?.openPopup();
  });

  stageCur.textContent = s.name;
  stageCur.classList.remove('empty');
  document.body.classList.add('spot-on');
  setCollapsed(false);
  stage.scrollTo({top:0, behavior:'smooth'});

  const token = ++reqToken;
  PHOTOS = [];
  const facts = [
    s.walk  && ['步行', s.walk],
    s.fee   && ['費用', s.fee],
    s.book  && ['預約', s.book],
    s.may   && ['5 月初', s.may],
    s.detour && ['繞路', s.detour]
  ].filter(Boolean);

  const seq = s.type
    ? `<span class="badge seq">${TYPES[s.type]} · 全程第 ${TYPE_SEQ.get(s)}／${TYPE_TOTAL[s.type]}</span>`
    : '';

  info.innerHTML = `
    <div class="i-head rise">
      <h2>${s.name}</h2><span class="i-zh">${s.zh}</span>
      ${s.dwell?`<span class="i-dwell">建議停留 ${hhmm(s.dwell)}</span>`:''}
      ${s.fixed?'<span class="badge fixed">已確定</span>':''}${seq}
      ${gmapLink(s)}${collapseBtnHtml()}
    </div>
    ${s.desc ? `<p class="i-desc rise rise-2">${s.desc}</p>`
      : '<p class="i-desc wait rise rise-2" id="sumDesc">載入維基百科摘要…</p>'}
    ${s.highlights ? `<div class="i-highs rise rise-2"><h3>這裡可看</h3><ul>${s.highlights.map(h => `<li>
      <b>${esc(h.t)}</b>${h.min ? `<span class="min">${hhmm(h.min)}</span>` : ''}<span class="d">${esc(h.d)}</span>
    </li>`).join('')}</ul></div>` : ''}
    ${facts.length ? `<dl class="i-facts rise rise-2">${
      facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>` : ''}
    ${planBox(s)}
    <div class="gallery rise rise-3" id="gal">
      ${'<div class="ph skel"></div>'.repeat(3)}
    </div>`;

  watchPeek();
  wirePlan(s);
  if(!s.desc) loadSummary(s, token);
  loadPhotos(s, token);
}

// 維基的照片有限，Google 地圖的景點頁有大量遊客照片與評論
const gmapLink = s => `<a class="i-gmap" href="https://www.google.com/maps/search/?api=1&query=${
  encodeURIComponent(placeQuery(s))}" target="_blank" rel="noopener">${icon('i-map')}在 Google 地圖開啟</a>`;
const collapseBtnHtml = () => `<button type="button" class="ghost-btn collapse-btn i-collapse" aria-expanded="${
  !document.body.classList.contains('stage-collapsed')}">${icon('i-chev-d')}<span class="lbl-open">收合</span><span class="lbl-closed">展開</span></button>`;

/* ================= 編輯：排入哪一天 =================
   在行程裡的景點：換天、移除；不在的：選一天加入。預設選目前所在的那天，
   不在行程裡的預設選最順路的那天。 */
function dayOptions(s){
  const cur = dayIndexOf(s);
  const rows = DAYS.map((d, i) => ({i, d, slot:bestSlot(i, s)}));
  const pick = cur >= 0 ? rows[cur]
    : rows.reduce((a, b) => b.slot.cost < a.slot.cost ? b : a);
  return {pick, html:rows.map(r => `<option value="${r.i}"${r === pick ? ' selected' : ''}>DAY ${r.d.n} · ${
    esc(r.d.title)}${r.i === cur ? '（目前）' : ''}</option>`).join('')};
}

function planBox(s){
  const {pick, html} = dayOptions(s), on = PLANNED.has(s);
  const alone = on && DAYS[dayIndexOf(s)].spots.length === 1;
  return `<div class="plan rise rise-2">
    <label for="planDay">${on ? '排在' : '排入'}</label>
    <select id="planDay">${html}</select>
    <button type="button" class="plan-go" id="planGo"${on ? ' disabled' : ''}>${on ? '移到這天' : '加入這天'}</button>
    ${on ? `<button type="button" class="ghost-btn" id="planRm"${alone ? ' disabled title="一天至少要留一站"' : ''}>從行程移除</button>` : ''}
  </div>`;
}

function wirePlan(s){
  const sel = document.getElementById('planDay'), go = document.getElementById('planGo');
  const on = PLANNED.has(s), cur = dayIndexOf(s);
  sel.addEventListener('change', () => { go.disabled = on && Number(sel.value) === cur; });
  go.addEventListener('click', () => { setDay(s, Number(sel.value) + 1); afterEdit(s); });
  document.getElementById('planRm')?.addEventListener('click', () => { setDay(s, 0); afterEdit(s); });
}

// 草稿動過：列表、路線、灰點、按鈕全部重來，右側留在同一個景點上
function afterEdit(s){
  buildList();
  syncEditBtn();
  if(rmap){ clearRoute(); drawRoute(false); }
  if(!s) return;
  if(PLANNED.has(s)){
    select(IDS.get(s), true);
    mapReady.then(() => MARKERS.get(s)?.openPopup());
  } else showPlace(POOL_KEY(s));
}
const POOL_KEY = s => [...POOL].find(([, e]) => e.spot === s)?.[0];

/* 不在行程裡的地點：同一個右側面板，內容換成維基百科摘要＋排入哪一天。
   center：從列表點來的，地圖一定移過去；從地圖或搜尋來的，看得到就不動 */
function showPlace(k, center){
  const e = POOL.get(k);
  if(!e) return;
  const s = spotFor(e);
  current = s;
  document.querySelectorAll('.spot.active').forEach(x=>x.classList.remove('active'));
  setMapOpen();
  mapReady.then(() => {
    if(!rmap) return;
    if(center || !rmap.getBounds().contains([s.lat, s.lng])){
      // 面板最多蓋住地圖下半（setPeek），點要落在露出來的上半
      const z = Math.max(rmap.getZoom(), 9);
      rmap.setView(rmap.unproject(rmap.project([s.lat, s.lng], z).add([0, stage.clientHeight * .25]), z), z);
    }
    drawPlaces();
    L.popup({offset:[0, -2]}).setLatLng([s.lat, s.lng])
      .setContent(`<span class="pop-h">${esc(s.name)}</span><span class="pop-zh">${esc(s.zh)}</span>`)
      .openOn(rmap);
  });

  stageCur.textContent = s.name;
  stageCur.classList.remove('empty');
  document.body.classList.add('spot-on');
  setCollapsed(false);
  stage.scrollTo({top:0, behavior:'smooth'});

  const token = ++reqToken;
  PHOTOS = [];
  const removed = BASE_DAY.has(s), why = NEARBY.get(s.wd)?.why;
  info.innerHTML = `
    <div class="i-head rise">
      <h2>${esc(s.name)}</h2><span class="i-zh">${esc(s.zh)}</span>
      <span class="badge${removed ? ' draft' : ''}">${removed ? '已從行程移除' : '不在行程裡'}</span>
      ${s.type ? `<span class="badge seq">${TYPES[s.type]}</span>` : ''}
      ${gmapLink(s)}${collapseBtnHtml()}
    </div>
    ${s.desc ? `<p class="i-desc rise rise-2">${s.desc}</p>`
      : '<p class="i-desc wait rise rise-2" id="sumDesc">載入維基百科摘要…</p>'}
    ${why ? `<dl class="i-facts rise rise-2"><div><dt>為何沒排</dt><dd>${esc(why)}</dd></div></dl>` : ''}
    ${planBox(s)}
    <div class="gallery rise rise-3" id="gal">
      ${'<div class="ph skel"></div>'.repeat(3)}
    </div>`;
  watchPeek();
  wirePlan(s);
  if(!s.desc) loadSummary(s, token);
  loadPhotos(s, token);
}

/* 摘要：英文條目的導言；有中文條目就改用中文（台灣正體）。都沒有就用 Wikidata 的一行描述 */
const ZHWIKI = 'https://zh.wikipedia.org/w/api.php';
const extract = j => Object.values(j?.query?.pages || {})[0];
async function loadSummary(s, token){
  const el = () => token === reqToken && document.getElementById('sumDesc');
  const place = [...POOL.values()].find(e => e.spot === s)?.place;
  let text = '', link = '';
  try{
    const en = extract(await fetchJson(api(WIKI, {action:'query', prop:'extracts|langlinks|info',
      exintro:'1', explaintext:'1', exsentences:'3', lllang:'zh', inprop:'url',
      titles:s.wiki || titleCandidates(s)[0], redirects:'1'}), 9000));
    if(en?.extract){ text = en.extract; link = en.fullurl; }
    const zt = en?.langlinks?.[0]?.['*'];
    if(zt){
      const zh = extract(await fetchJson(api(ZHWIKI, {action:'query', prop:'extracts|info', exintro:'1',
        explaintext:'1', exchars:'260', inprop:'url', titles:zt, redirects:'1', variant:'zh-tw'}), 9000));
      if(zh?.extract){ text = zh.extract; link = zh.fullurl; }
    }
  }catch(e){ /* 用下面的保底 */ }
  const box = el();
  if(!box) return;
  box.classList.remove('wait');
  box.innerHTML = text
    ? `${esc(text)}<a class="src" href="${esc(link)}" target="_blank" rel="noopener">維基百科</a>`
    : esc(place?.desc || '維基百科沒有這個地點的介紹');
}

/* ================= 更新行程：草稿 → GitHub Issue =================
   Issue 開好後由 .github/workflows/itinerary-update.yml 交給 Claude Code 改檔、推上 main。 */
const REPO = 'man572142/iceland-trip';
const btnEdits = document.getElementById('btnEdits');
const editN = document.getElementById('editN');

function syncEditBtn(){
  btnEdits.disabled = !EDITS.length;
  btnEdits.classList.toggle('has', EDITS.length > 0);
  editN.hidden = !EDITS.length;
  editN.textContent = EDITS.length;
}

// 每筆變更：from／to 是第幾天（0 = 不在行程）
function changeList(){
  return EDITS.map(([k]) => {
    const s = spotFor(POOL.get(k));
    return {k, s, place:POOL.get(k).place, from:BASE_DAY.get(s) || 0, to:dayIndexOf(s) + 1};
  });
}
const dayName = n => `Day ${n}`;
const kindOf = c => !c.from ? '新增' : !c.to ? '移除' : '換天';

function editsInfo(){
  const list = changeList();
  const rows = list.map(c => `<li class="change">
      <span class="change-k${c.to ? '' : ' rm'}">${kindOf(c)}</span>
      <span class="change-t"><button type="button" data-open="${esc(c.k)}">${esc(c.s.zh || c.s.name)}</button>
        ${c.from && c.to ? `${dayName(c.from)} → <b>${dayName(c.to)}</b>`
          : c.to ? `→ <b>${dayName(c.to)}</b>` : `原在 ${dayName(c.from)}`}</span>
      <button type="button" class="ghost-btn" data-undo="${esc(c.k)}">復原</button>
    </li>`).join('');
  return `<div class="i-head rise">
      <h2>更新行程</h2><span class="i-zh">${list.length} 項變更</span>
    </div>
    <p class="route-note rise rise-2" style="margin-top:0">送出後會開一張 GitHub Issue：先由固定腳本照清單改好站序與車程、推上 main，幾分鐘內網站就更新；新景點的介紹與當天說明再由 Claude Code 補上。</p>
    <ol class="changes rise rise-3">${rows}</ol>
    <div class="send rise rise-3">
      <a class="plan-go" id="sendIssue" href="${esc(issueUrl())}" target="_blank" rel="noopener">開 GitHub Issue</a>
      <button type="button" class="ghost-btn" id="dropEdits">全部捨棄</button>
      <p class="send-note">需要登入有這個 repo 權限的 GitHub 帳號；開好之後這裡的草稿會保留，等網站更新後自動消失。</p>
    </div>`;
}

function issueBody(){
  const list = changeList();
  const nm = x => x.zh ? `${x.name}（${x.zh}）` : x.name;
  const at = ({a, b}) => a && b ? `插在 ${nm(a)} 與 ${nm(b)} 之間`
    : a ? `排在當天最後，${nm(a)} 之後` : b ? `排在當天第一站，${nm(b)} 之前` : '當天唯一一站';
  const lines = list.map(c => {
    if(!c.to) return `- 移除 **${nm(c.s)}**：原在 ${dayName(c.from)}`;
    const sp = DAYS[c.to - 1].spots, i = sp.indexOf(c.s);
    const near = at({a:sp[i-1], b:sp[i+1]});
    return c.from
      ? `- 換天 **${nm(c.s)}**：${dayName(c.from)} → ${dayName(c.to)}，${near}`
      : `- 新增 **${nm(c.s)}** → ${dayName(c.to)}，${near}`;
  });
  // tools/apply_edits.mjs 吃這段：受影響的每一天完整的站序，加上新景點的資料
  const days = {}, add = {};
  list.forEach(c => [c.from, c.to].filter(Boolean).forEach(n => days[n] = DAYS[n-1].spots.map(keyOf)));
  list.filter(c => !c.from).forEach(c => add[c.k] =
    {name:c.s.name, zh:c.s.zh || null, lat:c.s.lat, lng:c.s.lng, type:c.s.type, wiki:c.s.wiki || null});
  const data = {v:2, days, add};
  return `由網站「更新行程」送出。

${lines.join('\n')}

\`\`\`json
${JSON.stringify(data)}
\`\`\`
`;
}

const issueTitle = () => {
  const n = {}; changeList().forEach(c => n[kindOf(c)] = (n[kindOf(c)] || 0) + 1);
  return '[行程更新] ' + Object.entries(n).map(([k, v]) => `${k} ${v}`).join('、');
};
const ISSUE_MAX = 7000;   // GitHub 的網址太長會 414，超過就改用剪貼簿
function issueUrl(body = issueBody()){
  return `https://github.com/${REPO}/issues/new?` + new URLSearchParams({title:issueTitle(), body});
}

function showEdits(){
  if(!EDITS.length){ showHome(); return; }
  current = null;
  drawPlaces();
  PHOTOS = [];
  ++reqToken;
  document.querySelectorAll('.spot.active').forEach(x=>x.classList.remove('active'));
  rmap?.closePopup();
  document.body.classList.add('spot-on');
  setCollapsed(false);
  stageCur.textContent = '更新行程';
  stageCur.classList.remove('empty');
  info.innerHTML = editsInfo();
  watchPeek();
  stage.scrollTo({top:0, behavior:'smooth'});
}
btnEdits.addEventListener('click', showEdits);

info.addEventListener('click', async e => {
  const t = e.target.closest('[data-undo],[data-open],#dropEdits,#sendIssue');
  if(!t) return;
  if(t.dataset.undo){
    const s = spotFor(POOL.get(t.dataset.undo));
    setDay(s, BASE_DAY.get(s) || 0);
    afterEdit(null);
    showEdits();
  } else if(t.dataset.open){
    const s = spotFor(POOL.get(t.dataset.open));
    PLANNED.has(s) ? select(IDS.get(s)) : showPlace(t.dataset.open);
  } else if(t.id === 'dropEdits'){
    if(!confirm(`捨棄全部 ${EDITS.length} 項變更？`)) return;
    EDITS = [];
    applyEdits();
    afterEdit(null);
    showHome();
  } else if(t.href.length > ISSUE_MAX){
    // 內容太長：先複製到剪貼簿，Issue 頁面只帶標題
    e.preventDefault();
    try{ await navigator.clipboard.writeText(issueBody()); }catch(err){}
    window.open(issueUrl('（變更清單已複製到剪貼簿，請貼在這裡）'), '_blank', 'noopener');
  }
});

/* ========== 實景照片：維基百科 Action API（免 API key、CORS 開放） ==========
   只用 en.wikipedia.org/w/api.php 這一個端點。
   註：舊版曾用 /api/rest_v1/page/media-list/，該端點已隨 RESTBase 退役，不要再用。
   兩次請求：先取條目內的圖片清單（保持條目順序），再一次取回網址與授權資訊。 */

const WIKI    = 'https://en.wikipedia.org/w/api.php';
const COMMONS = 'https://commons.wikimedia.org/w/api.php';

const PHOTO_EXT = /\.(jpe?g|png|webp)$/i;
// 旗幟、地圖、圖示等非實景檔案
const SKIP = /(^(File:)?(Flag|Coat[ _]of[ _]arms|Icon|Symbol|Commons-logo|Wikidata|OOjs|Ambox|Question[ _]book)\b|location[ _]map|(^|[:_ ])map([ _]of\b|\.)|locator|relief[ _]map|blank[ _]map|_pog\.|\.svg$|\.gif$)/i;

let netOk = false;      // 這次載入有沒有真的連上維基（用來分辨「找不到」與「連不上」）

const api = (base, params) =>
  base + '?' + new URLSearchParams({ format:'json', origin:'*', ...params });

async function fetchJson(url, timeoutMs){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const r = await fetch(url, {signal:ctrl.signal});
    netOk = true;         // 收到任何回應（含 404）就代表連得上
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally {
    clearTimeout(t);
  }
}

// "Sólfar (Sun Voyager)" → ["Sun Voyager","Sólfar"]；"Geysir / Strokkur" → ["Geysir","Strokkur"]
// 括號內外取較長的當首選，避免拿 "(KEF)" 這種縮寫去查條目。
function titleCandidates(s){
  const out = s.wiki ? [s.wiki] : [];   // 從地圖加的地點帶著英文維基條目名
  s.name.split(' / ').map(t=>t.trim()).filter(Boolean).forEach(n=>{
    const m = n.match(/^(.*?)\s*\(([^)]+)\)$/);
    if(m){
      const a = m[1].trim(), b = m[2].trim();
      out.push(...(a.length >= b.length ? [a,b] : [b,a]));
    } else out.push(n);
  });
  return [...new Set(out.filter(Boolean))];
}

// Wikimedia 縮圖網址可以直接改寬度
function atWidth(src, w){
  if(!src) return src;
  const u = src.startsWith('//') ? 'https:' + src : src;
  return u.includes('/thumb/') ? u.replace(/\/\d+px-([^/]+)$/, `/${w}px-$1`) : u;
}

const norm      = t => t.replace(/^File:/i,'').replace(/_/g,' ').trim();
const fileLabel = t => norm(t).replace(/\.[a-z0-9]+$/i,'');

// 條目內的圖片檔名，順序同條目（action=parse 會照出現順序回傳）
async function articleFiles(title){
  const j = await fetchJson(api(WIKI, {action:'parse', page:title, prop:'images', redirects:'1'}), 9000);
  if(j?.error) return null;
  return { title: j?.parse?.title || title, files: j?.parse?.images || [] };
}

// 一次取回所有圖片的網址與授權資訊
async function filesToPhotos(files, s){
  if(!files.length) return [];
  const j = await fetchJson(api(WIKI, {
    action:'query',
    titles: files.map(f=>'File:'+f).join('|'),
    prop:'imageinfo',
    iiprop:'url|extmetadata',
    iiurlwidth:'640',
    iiextmetadatafilter:'Artist|ObjectName'
  }), 9000);

  const byName = {};
  Object.values(j?.query?.pages || {}).forEach(p=>{
    const i = p.imageinfo?.[0];
    if(i && i.thumburl) byName[norm(p.title)] = {info:i, title:p.title};
  });

  return files
    .map(f => byName[norm(f)])
    .filter(Boolean)
    .slice(0, 6)
    .map((e, n) => ({
      thumb : e.info.thumburl,
      full  : atWidth(e.info.thumburl, 1600) || e.info.url,
      page  : e.info.descriptionurl || `https://commons.wikimedia.org/wiki/${encodeURIComponent(e.title)}`,
      title : (e.info.extmetadata?.ObjectName?.value || '').replace(/<[^>]*>/g,'').trim() || fileLabel(e.title),
      author: (e.info.extmetadata?.Artist?.value || '').replace(/<[^>]*>/g,'').trim().slice(0,40),
      alt   : `${s.name} 實景照片 ${n+1}`
    }));
}

// 條目主圖：條目沒有圖庫時的保底
async function leadImage(title, s){
  const j = await fetchJson(api(WIKI, {
    action:'query', titles:title, redirects:'1',
    prop:'pageimages', piprop:'original|thumbnail', pithumbsize:'640'
  }), 8000);
  const p = Object.values(j?.query?.pages || {})[0];
  const src = p?.original?.source || p?.thumbnail?.source;
  if(!src) return [];
  return [{
    thumb : p?.thumbnail?.source || src,
    full  : p?.original?.source || src,
    page  : `https://en.wikipedia.org/wiki/${encodeURIComponent(title)}`,
    title : p?.title || s.name,
    author: '',
    alt   : `${s.name} 實景照片`
  }];
}

// 最後手段：Commons 全文檢索（慢，且結果混雜，保留搜尋相關性排序）
async function searchCommons(q, s){
  const j = await fetchJson(api(COMMONS, {
    action:'query', generator:'search', gsrnamespace:'6', gsrlimit:'20', gsrsearch:q,
    prop:'imageinfo', iiprop:'url|extmetadata', iiurlwidth:'640'
  }), 9000);
  return Object.values(j?.query?.pages || {})
    .sort((a,b)=>(a.index||0)-(b.index||0))
    .filter(p => !SKIP.test(p.title||''))
    .map(p => {
      const i = p.imageinfo?.[0];
      if(!i || !PHOTO_EXT.test(p.title)) return null;   // i.url 可能帶查詢字串，副檔名看檔名
      return {
        thumb : i.thumburl || i.url,
        full  : atWidth(i.thumburl, 1600) || i.url,
        page  : i.descriptionurl,
        title : (i.extmetadata?.ObjectName?.value || '').replace(/<[^>]*>/g,'') || fileLabel(p.title),
        author: (i.extmetadata?.Artist?.value || '').replace(/<[^>]*>/g,'').slice(0,40),
        alt   : `${s.name} 實景照片`
      };
    })
    .filter(Boolean)
    .slice(0, 6);
}

/* ========== 實景照片：Wikimedia Commons 依座標搜尋（主要來源，免金鑰） ==========
   景點座標 1 km 內有地理標記的照片（多半是旅人拍、從 Flickr 轉存的實景）；
   不足 4 張再放寬到 5 km。精選／優質圖片排前面，同一位作者最多 2 張。
   排除地圖、繪畫、版畫等非實景，以及 1990 年前拍攝的老照片。 */
const NOT_PHOTO = /\b(maps?|drawings?|paintings?|illustrations?|engravings?|lithographs?|diagrams?|logos?|postcards?|historical images|old photographs|charts?)\b/i;
const strip = h => String(h || '').replace(/<[^>]*>/g, '').trim();
// 作者欄常夾著授權說明：只取第一段文字
const firstText = h => String(h || '').replace(/<[^>]*>/g, '\n').split('\n')
  .map(t => t.replace(/\s+/g, ' ').trim()).find(Boolean) || '';

async function nearbyFiles(s, m){
  const j = await fetchJson(api(COMMONS, {
    action:'query', generator:'geosearch', ggscoord:`${s.lat}|${s.lng}`, ggsradius:String(m),
    ggsnamespace:'6', ggslimit:'50',
    prop:'imageinfo', iiprop:'url|extmetadata|mime|size', iiurlwidth:'640',
    iiextmetadatafilter:'Artist|ObjectName|DateTimeOriginal|Categories'
  }), 9000);
  return Object.values(j?.query?.pages || {})
    .sort((a,b) => (a.index||0) - (b.index||0))       // 由近到遠
    .map(p => ({p, i:p.imageinfo?.[0]}))
    .filter(({p, i}) => {
      if(!i || !i.thumburl || !/^image\/(jpeg|png|webp)$/.test(i.mime) || SKIP.test(p.title)) return false;
      if(Math.max(i.width, i.height) < 800) return false;
      const m = i.extmetadata || {};
      if(NOT_PHOTO.test(strip(m.Categories?.value))) return false;
      const y = Number(strip(m.DateTimeOriginal?.value).match(/\b(1[89]\d\d|20\d\d)\b/)?.[1]);
      return !(y && y < 1990);
    });
}

async function nearbyPhotos(s){
  let list = await nearbyFiles(s, 1000);
  if(list.length < 4) list = list.concat(await nearbyFiles(s, 5000));
  const rank = ({i}) => /Featured pictures/.test(i.extmetadata?.Categories?.value) ? 0
    : /Quality images|Valued images/.test(i.extmetadata?.Categories?.value) ? 1 : 2;
  const seen = new Set(), perAuthor = {};
  return list
    .map((e, n) => ({...e, n}))
    .sort((a,b) => rank(a) - rank(b) || a.n - b.n)      // 精選優先，其餘維持由近到遠
    .filter(({p}) => !seen.has(p.title) && seen.add(p.title))
    .filter(({i}) => {
      const who = firstText(i.extmetadata?.Artist?.value) || '?';
      return (perAuthor[who] = (perAuthor[who] || 0) + 1) <= 2;
    })
    .slice(0, 6)
    .map(({p, i}, n) => ({
      thumb : i.thumburl,
      full  : atWidth(i.thumburl, 1600) || i.url,
      page  : i.descriptionurl,
      title : strip(i.extmetadata?.ObjectName?.value) || fileLabel(p.title),
      author: firstText(i.extmetadata?.Artist?.value).slice(0, 40),
      alt   : `${s.name} 實景照片 ${n+1}`
    }));
}

// 照片下方：到 Google 圖片／Flickr 看更多
const moreLinks = s => `
  <p class="gal-more">更多照片：
    <a href="${imgSearchUrl(s.name)}" target="_blank" rel="noopener">Google 圖片</a>
    <a href="https://www.flickr.com/search/?${new URLSearchParams({lat:s.lat, lon:s.lng, radius:'1',
      has_geo:'1', sort:'interestingness-desc', view_all:'1'})}" target="_blank" rel="noopener">Flickr 附近照片</a>
  </p>`;

const imgSearchUrl = name =>
  'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(name + ' Iceland');

async function loadPhotos(s, token){
  const gal  = document.getElementById('gal');

  let photos = [];
  netOk = false;

  // 0) 座標附近有地理標記的照片
  try{ photos = await nearbyPhotos(s); }catch(e){ /* 換下一種來源 */ }
  if(token !== reqToken) return;
  if(photos.length){ PHOTOS = photos; renderGallery(gal, s, photos); return; }

  // 1) 用景點名稱找條目
  let art = null;
  for(const t of titleCandidates(s)){
    try{ art = await articleFiles(t); }catch(e){ art = null; }
    if(token !== reqToken) return;                     // 已切換到別的景點
    if(art) break;
  }

  // 2) 名稱找不到就用 q 全文搜尋條目
  if(!art){
    try{
      const j = await fetchJson(api(WIKI, {action:'query', list:'search', srnamespace:'0', srlimit:'1', srsearch:s.q}), 9000);
      const hit = j?.query?.search?.[0]?.title;
      if(hit) art = await articleFiles(hit);
    }catch(e){ /* 換下一種來源 */ }
    if(token !== reqToken) return;
  }

  // 3) 條目內的圖片
  if(art){
    const files = art.files.filter(f => PHOTO_EXT.test(f) && !SKIP.test(f)).slice(0, 8);
    try{ photos = await filesToPhotos(files, s); }catch(e){ /* 換下一種來源 */ }
    if(token !== reqToken) return;
  }

  // 4) 條目主圖
  if(!photos.length && art){
    try{ photos = await leadImage(art.title, s); }catch(e){ /* 換下一種來源 */ }
    if(token !== reqToken) return;
  }

  // 5) Commons 全文檢索
  if(!photos.length){
    try{ photos = await searchCommons(s.q, s); }catch(e){ /* 全部失敗 */ }
    if(token !== reqToken) return;
  }

  if(!photos.length){ fallback(gal, s, !netOk); return; }

  PHOTOS = photos;
  renderGallery(gal, s, photos);
}

function renderGallery(gal, s, photos){
  gal.innerHTML = moreLinks(s) + photos.map((p, n) => `
    <div class="ph">
      <button type="button" class="shot" data-i="${n}" aria-label="放大檢視：${esc(p.alt)}">
        <img src="${esc(p.thumb)}" alt="${esc(p.alt)}" loading="lazy">
      </button>
      <a class="cred" href="${esc(p.page)}" target="_blank" rel="noopener">${esc(p.title)}${p.author ? ' · ' + esc(p.author) : ''}</a>
    </div>`).join('');

  gal.querySelectorAll('.ph img').forEach(im=>{
    if(im.complete && im.naturalWidth) im.classList.add('ready');
    else im.addEventListener('load', ()=> im.classList.add('ready'), {once:true});
    im.addEventListener('error', ()=>{
      im.closest('.ph')?.remove();
      if(!gal.querySelector('.ph') && gal.isConnected) fallback(gal, s, false);   // 全部載不出來
    });
  });
  gal.querySelectorAll('.shot').forEach(btn=>{
    btn.addEventListener('click', ()=> openLb(Number(btn.dataset.i), btn));
  });
}

function fallback(gal, s, failed){
  gal.innerHTML = `
    <div class="gal-msg">
      ${icon('i-image-off')}
      <div>
        <b>${failed ? '照片載入失敗' : '找不到這個地點的照片'}</b>
        <p>${failed
          ? '可能是網路連線不穩，或目前連不到照片來源。稍後重新整理即可再試一次。'
          : '這個地點附近沒有可顯示的照片，可以直接到 Google 圖片搜尋。'}</p>
        <a href="${imgSearchUrl(s.name)}" target="_blank" rel="noopener">
          在 Google 圖片搜尋「${esc(s.name)}」
        </a>
      </div>
    </div>`;
}

/* ================= Lightbox ================= */
let PHOTOS = [];
let lbIndex = 0;
let lbOpener = null;

const lb      = document.getElementById('lb');
const lbFig   = document.getElementById('lbFig');
let   lbImg   = null;
const lbCap   = document.getElementById('lbCap');
const lbPrev  = document.getElementById('lbPrev');
const lbNext  = document.getElementById('lbNext');
const lbClose = document.getElementById('lbClose');

function renderLb(){
  const p = PHOTOS[lbIndex];
  if(!p) return;
  if(!lbImg){ lbImg = document.createElement('img'); lbFig.prepend(lbImg); }
  // 大圖網址偶爾載入失敗（如維基媒體放大失敗），退回已知可用的縮圖
  lbImg.onerror = e => { if(e.target.src !== p.thumb) e.target.src = p.thumb; };
  lbImg.src = p.full;
  lbImg.alt = p.alt;
  lbCap.innerHTML = `<a href="${esc(p.page)}" target="_blank" rel="noopener">${esc(p.title)}</a>`
    + (p.author ? ` <span>· ${esc(p.author)}</span>` : '')
    + (PHOTOS.length>1 ? ` <span class="n">${lbIndex+1} / ${PHOTOS.length}</span>` : '');
  const many = PHOTOS.length > 1;
  lbPrev.hidden = !many;
  lbNext.hidden = !many;
}

function openLb(i, opener){
  lbIndex = i;
  lbOpener = opener || null;
  renderLb();
  lb.classList.add('on');
  document.body.style.overflow = 'hidden';
  lbClose.focus();
}

function closeLb(){
  if(!lb.classList.contains('on')) return;
  lb.classList.remove('on');
  lbImg?.remove();
  lbImg = null;
  document.body.style.overflow = '';
  lbOpener?.focus();
  lbOpener = null;
}

function stepLb(d){
  if(PHOTOS.length < 2) return;
  lbIndex = (lbIndex + d + PHOTOS.length) % PHOTOS.length;
  renderLb();
}

lbClose.addEventListener('click', closeLb);
lbPrev.addEventListener('click', ()=>stepLb(-1));
lbNext.addEventListener('click', ()=>stepLb(1));
// 只有點在背景才關閉，點圖片本身不會關
lb.addEventListener('click', e=>{ if(e.target === lb) closeLb(); });

document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('on')) return;
  if(e.key === 'Escape'){ closeLb(); return; }
  if(e.key === 'ArrowLeft'){ stepLb(-1); return; }
  if(e.key === 'ArrowRight'){ stepLb(1); return; }
  if(e.key === 'Tab'){
    // 焦點鎖在燈箱內
    const items = [lbClose, lbPrev, lbNext].filter(b=>!b.hidden);
    const i = items.indexOf(document.activeElement);
    const next = e.shiftKey
      ? items[(i<=0 ? items.length : i) - 1]
      : items[(i + 1) % items.length];
    next.focus();
    e.preventDefault();
  }
});

/* ================= 候選地點：public/places.json（tools/build_places.py 從 Wikidata 產生） =================
   跟原有景點對得上的不另外畫點：同一個 Wikidata、60 m 內、15 km 內同名（Wikidata 座標常偏好幾 km），
   或 4 km 內名稱包含。
   地點名稱包含景點名稱只算在非城鎮的景點上 —— Húsavíkurkirkja 不是 Húsavík。 */
const fold = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .replace(/ð/g, 'd').replace(/þ/g, 'th').replace(/æ/g, 'ae').replace(/ø/g, 'o');

function loadPlaces(list){
  list.forEach(p => {
    if(NEARBY.has(p.id)) return;
    const a = fold(p.name);
    const hit = BASE_ALL.find(s => s.wd === p.id) || BASE_ALL.find(s => {
      const d = geoKm(s, p), parts = fold(s.name).split(/\s*[&/()]\s*/).filter(Boolean);
      if(d < 15 && parts.includes(a)) return true;   // "Dettifoss & Selfoss" 含 Dettifoss
      return d < .06 || d < 4 && s.type !== 'transit' && parts.some(b =>
        a.length > 3 && b.includes(a) || s.type !== 'town' && b.length > 3 && a.includes(b));
    });
    if(hit) POOL.get(keyOf(hit)).place ||= p;
    else POOL.set(p.id, {spot:null, place:p});
  });
  // 有 places.json 條目就用條目，中文名跟列表上寫的一致；沒有條目就用項目自己的欄位，
  // sl:-1 讓它只在面板開著時才畫點
  NEARBY.forEach((n, k) => {
    const p = list.find(x => x.id === k);
    POOL.set(k, {spot:null, place:p ? {...p, zh:n.zh} : {...n, id:k, sl:-1}});
  });
  placesReady = true;
  const pending = EDITS.some(([k]) => !BASE_ALL.some(s => keyOf(s) === k));
  applyEdits();
  syncEditBtn();
  if(pending){   // 草稿裡有從地圖加的點，現在才排得進去
    buildList();
    if(rmap){ clearRoute(); drawRoute(false); }
  } else drawPlaces();
}

/* ================= 初始 ================= */
setMapOpen();
syncEditBtn();
const placesLoaded = fetch('./places.json').then(r => r.ok ? r.json() : []).catch(() => []).then(loadPlaces);
